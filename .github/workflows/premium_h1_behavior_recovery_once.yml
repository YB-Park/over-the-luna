name: Premium H1 behavior-oracle recovery

on:
  push:
    branches:
      - experiment/premium-luna-orchestration
    paths:
      - .github/workflows/premium_h1_behavior_recovery_once.yml

permissions:
  contents: read
  actions: read

jobs:
  recover-h1:
    runs-on: ubuntu-latest
    steps:
      - name: Check out evaluation branch
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Download exact H1 arm artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "${{ runner.temp }}/h1-artifact"
          gh run download 34325241072             --repo YB-Park/over-the-luna             --name premium-heldout-h1-redis-hiredis             --dir "${{ runner.temp }}/h1-artifact"
          sha256sum "${{ runner.temp }}/h1-artifact/"*.diff             | tee "${{ runner.temp }}/h1-recovery-diff-sha256.txt"

      - name: Reconstruct historical base and apply frozen arm patches
        run: |
          base="${{ runner.temp }}/h1-recovery-base"
          mkdir -p "$base"
          cd "$base"
          git init -q
          git remote add origin https://github.com/redis/redis-py.git
          git fetch -q --depth=1 origin b121809bd7c7107eedb6b9849180c83246419961
          git checkout -q --detach FETCH_HEAD
          test "$(git rev-list --count HEAD)" = "1"
          python -m pip install -q -r dev_requirements.txt 'hiredis>=3.2.0'

          cd "${{ runner.temp }}"
          for arm in raw premium otl; do
            cp -a h1-recovery-base "h1-recovery-$arm"
            git -C "h1-recovery-$arm" apply "${{ runner.temp }}/h1-artifact/h1-$arm.diff"
          done

      - name: Write helper-independent H1 behavior oracle
        run: |
          for arm in raw premium otl; do
            cat > "${{ runner.temp }}/h1-recovery-$arm/tests/test_h1_product_oracle.py" <<'PY'
          import socket
          import time
          from unittest import mock

          import pytest

          from redis._parsers.hiredis import _HiredisParser
          from redis.exceptions import ConnectionError


          class _Encoder:
              encoding_errors = "strict"
              decode_responses = False
              encoding = "utf-8"


          class _Connection:
              def __init__(self, sock):
                  self._sock = sock
                  self.socket_timeout = None
                  self.encoder = _Encoder()


          def _parser(sock):
              parser = _HiredisParser(socket_read_size=65536)
              parser.on_connect(_Connection(sock))
              return parser


          def _wait_readable():
              # Give the local kernel enough time to publish FIN/readability.
              time.sleep(0.05)


          def test_peer_close_without_pending_data_is_not_reusable():
              client, server = socket.socketpair()
              parser = _parser(client)
              try:
                  server.close()
                  _wait_readable()
                  with pytest.raises(ConnectionError, match="Connection closed by server"):
                      parser.can_read(timeout=0)
              finally:
                  parser.on_disconnect()
                  client.close()


          def test_pending_resp3_push_survives_until_processed_before_close():
              listener = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
              listener.bind(("127.0.0.1", 0))
              listener.listen(1)
              client = socket.create_connection(listener.getsockname())
              server, _ = listener.accept()
              parser = _parser(client)
              try:
                  payload = (
                      b">3\r\n"
                      b"$7\r\nmessage\r\n"
                      b"$2\r\nch\r\n"
                      b"$5\r\nhello\r\n"
                  )
                  server.sendall(payload)
                  server.close()
                  _wait_readable()

                  assert parser.can_read(timeout=0) is True
                  assert parser.read_response(push_request=True) == [
                      b"message",
                      b"ch",
                      b"hello",
                  ]

                  with pytest.raises(ConnectionError, match="Connection closed by server"):
                      parser.can_read(timeout=0)
              finally:
                  parser.on_disconnect()
                  client.close()
                  listener.close()


          def test_open_readable_push_remains_available():
              client, server = socket.socketpair()
              parser = _parser(client)
              try:
                  server.sendall(
                      b">3\r\n"
                      b"$7\r\nmessage\r\n"
                      b"$2\r\nch\r\n"
                      b"$4\r\nlive\r\n"
                  )
                  assert parser.can_read(timeout=0) is True
                  assert parser.read_response(push_request=True) == [
                      b"message",
                      b"ch",
                      b"live",
                  ]
              finally:
                  parser.on_disconnect()
                  client.close()
                  server.close()


          def test_ssl_like_socket_that_rejects_recv_flags_still_detects_eof(monkeypatch):
              # SSLSocket.recv(..., flags) raises ValueError. A robust can_read
              # implementation must not therefore treat a known-readable EOF as
              # a healthy reusable connection.
              class SSLishSocket:
                  def __init__(self):
                      self.timeout = None

                  def pending(self):
                      return 0

                  def recv(self, size, flags=0):
                      if flags:
                          raise ValueError("non-zero flags not allowed")
                      return b""

                  def recv_into(self, buffer):
                      return 0

                  def settimeout(self, value):
                      self.timeout = value

              parser = _HiredisParser.__new__(_HiredisParser)
              parser._reader = mock.Mock()
              parser._reader.has_data.return_value = False
              parser._sock = SSLishSocket()
              parser._buffer = bytearray(65536)
              parser._socket_timeout = None

              import redis._parsers.hiredis as hiredis_mod

              monkeypatch.setattr(hiredis_mod, "_socket_can_read", lambda sock, timeout: True)

              with pytest.raises(ConnectionError, match="Connection closed by server"):
                  parser.can_read(timeout=0)
          PY
          done

      - name: Run identical product-behavior oracle
        run: |
          set +e
          for arm in raw premium otl; do
            (
              cd "${{ runner.temp }}/h1-recovery-$arm"
              PYTHONPATH=. python -m pytest -q tests/test_h1_product_oracle.py
            ) > "${{ runner.temp }}/h1-$arm-behavior.txt" 2>&1
            code=$?
            echo "$code" > "${{ runner.temp }}/h1-$arm-behavior.exit"
            echo "===== $arm behavior oracle exit=$code ====="
            cat "${{ runner.temp }}/h1-$arm-behavior.txt"
          done
          exit 0

      - name: Upload H1 behavior recovery
        uses: actions/upload-artifact@v4
        with:
          name: premium-heldout-h1-behavior-recovery
          path: |
            ${{ runner.temp }}/h1-recovery-diff-sha256.txt
            ${{ runner.temp }}/h1-raw-behavior.txt
            ${{ runner.temp }}/h1-raw-behavior.exit
            ${{ runner.temp }}/h1-premium-behavior.txt
            ${{ runner.temp }}/h1-premium-behavior.exit
            ${{ runner.temp }}/h1-otl-behavior.txt
            ${{ runner.temp }}/h1-otl-behavior.exit
