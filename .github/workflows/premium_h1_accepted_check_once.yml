name: Premium H1 accepted-oracle check

on:
  push:
    branches:
      - experiment/premium-luna-orchestration
    paths:
      - .github/workflows/premium_h1_accepted_check_once.yml

permissions:
  contents: read

jobs:
  accepted:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Prepare accepted Redis head
        run: |
          dir="${{ runner.temp }}/redis-accepted"
          mkdir -p "$dir"
          cd "$dir"
          git init -q
          git remote add origin https://github.com/redis/redis-py.git
          git fetch -q --depth=1 origin 55d41593d3795080cdfc090ed56c19d9ab4ea3b1
          git checkout -q --detach FETCH_HEAD
          python -m pip install -q pytest pytest-asyncio pytest-timeout 'hiredis>=3.2.0'

      - name: Run helper-independent product oracle on accepted head
        working-directory: ${{ runner.temp }}/redis-accepted
        run: |
          cat > tests/test_h1_product_oracle.py <<'PY'
          import socket
          import time
          from unittest import mock
          import pytest
          from redis._parsers.hiredis import _HiredisParser
          from redis.exceptions import ConnectionError

          class _Encoder:
              encoding_errors = "strict"
              decode_responses = False
              encoding = "utf-8"

          class _Connection:
              def __init__(self, sock):
                  self._sock = sock
                  self.socket_timeout = None
                  self.encoder = _Encoder()

          def _parser(sock):
              parser = _HiredisParser(socket_read_size=65536)
              parser.on_connect(_Connection(sock))
              return parser

          def _wait_readable():
              time.sleep(0.05)

          def test_peer_close_without_pending_data_is_not_reusable():
              client, server = socket.socketpair()
              parser = _parser(client)
              try:
                  server.close()
                  _wait_readable()
                  with pytest.raises(ConnectionError, match="Connection closed by server"):
                      parser.can_read(timeout=0)
              finally:
                  parser.on_disconnect()
                  client.close()

          def test_pending_resp3_push_survives_until_processed_before_close():
              listener = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
              listener.bind(("127.0.0.1", 0))
              listener.listen(1)
              client = socket.create_connection(listener.getsockname())
              server, _ = listener.accept()
              parser = _parser(client)
              try:
                  payload = (
                      b">3\r\n$7\r\nmessage\r\n$2\r\nch\r\n$5\r\nhello\r\n"
                  )
                  server.sendall(payload)
                  server.close()
                  _wait_readable()
                  assert parser.can_read(timeout=0) is True
                  assert parser.read_response(push_request=True) == [b"message", b"ch", b"hello"]
                  with pytest.raises(ConnectionError, match="Connection closed by server"):
                      parser.can_read(timeout=0)
              finally:
                  parser.on_disconnect()
                  client.close()
                  listener.close()

          def test_open_readable_push_remains_available():
              client, server = socket.socketpair()
              parser = _parser(client)
              try:
                  server.sendall(b">3\r\n$7\r\nmessage\r\n$2\r\nch\r\n$4\r\nlive\r\n")
                  assert parser.can_read(timeout=0) is True
                  assert parser.read_response(push_request=True) == [b"message", b"ch", b"live"]
              finally:
                  parser.on_disconnect()
                  client.close()
                  server.close()

          def test_ssl_like_socket_that_rejects_recv_flags_still_detects_eof(monkeypatch):
              class SSLishSocket:
                  def __init__(self):
                      self.timeout = None
                  def pending(self):
                      return 0
                  def recv(self, size, flags=0):
                      if flags:
                          raise ValueError("non-zero flags not allowed")
                      return b""
                  def recv_into(self, buffer):
                      return 0
                  def settimeout(self, value):
                      self.timeout = value

              parser = _HiredisParser.__new__(_HiredisParser)
              parser._reader = mock.Mock()
              parser._reader.has_data.return_value = False
              parser._sock = SSLishSocket()
              parser._buffer = bytearray(65536)
              parser._socket_timeout = None
              import redis._parsers.hiredis as hiredis_mod
              monkeypatch.setattr(hiredis_mod, "_socket_can_read", lambda sock, timeout: True)
              with pytest.raises(ConnectionError, match="Connection closed by server"):
                  parser.can_read(timeout=0)
          PY
          PYTHONPATH=. python -m pytest -q tests/test_h1_product_oracle.py | tee "${{ runner.temp }}/h1-accepted-behavior.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: premium-h1-accepted-oracle-check
          path: ${{ runner.temp }}/h1-accepted-behavior.txt
