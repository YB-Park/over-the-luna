name: v1.1 one-shot wildcard schema MCP gate

# ONE-SHOT PAID RESEARCH WORKFLOW. Delete immediately after launch.
on:
  pull_request:
    paths:
      - '.github/workflows/v1_1_wildcard_mcp_once.yml'
  workflow_dispatch:

permissions:
  contents: read
  copilot-requests: write

jobs:
  wildcard-mcp:
    strategy:
      fail-fast: false
      matrix:
        repeat: [1, 2]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install Copilot CLI and MCP SDK
        run: |
          npm install -g @github/copilot
          python -m pip install mcp
      - name: Build wildcard-schema RC2 candidate and local MCP
        run: |
          set -euo pipefail
          cp -R . "${RUNNER_TEMP}/wildcard-plugin"
          rm -rf "${RUNNER_TEMP}/wildcard-plugin/.git"
          cp experiments/v1_1_candidate_rc2.agent.md "${RUNNER_TEMP}/wildcard-plugin/agents/over-the-luna.agent.md"
          cp experiments/v1_1_candidate_architect_packet_v3.agent.md "${RUNNER_TEMP}/wildcard-plugin/agents/luna-architect.agent.md"
          cp experiments/v1_1_candidate_reviewer_rc.agent.md "${RUNNER_TEMP}/wildcard-plugin/agents/luna-reviewer.agent.md"
          cp experiments/v1_1_candidate_premium_review.agent.md "${RUNNER_TEMP}/wildcard-plugin/agents/premium-review.agent.md"
          rm -f "${RUNNER_TEMP}/wildcard-plugin/agents/sonnet-reviewer.agent.md" "${RUNNER_TEMP}/wildcard-plugin/agents/opus-critical-reviewer.agent.md"
          python - <<'PY'
          import os
          from pathlib import Path
          p = Path(os.environ['RUNNER_TEMP']) / 'wildcard-plugin' / 'agents' / 'over-the-luna.agent.md'
          text = p.read_text(encoding='utf-8')
          marker = "disable-model-invocation: true\n"
          assert marker in text
          text = text.replace(marker, marker + "tools: ['*', 'agent']\n", 1)
          p.write_text(text, encoding='utf-8')
          PY
          cat > "${RUNNER_TEMP}/v11_gate_mcp.py" <<'PY'
          from mcp.server.fastmcp import FastMCP

          server = FastMCP('v11gate')

          @server.tool()
          def echo(value: str) -> str:
              """Return a deterministic v1.1 Gate A marker for tool-availability tests."""
              return f'WILDCARD_MCP_OK:{value}'

          if __name__ == '__main__':
              server.run(transport='stdio')
          PY
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          cfg = {
            'mcpServers': {
              'v11gate': {
                'type': 'local',
                'command': 'python',
                'args': [str(root / 'v11_gate_mcp.py')],
                'tools': ['*'],
              }
            }
          }
          (root / 'mcp.json').write_text(json.dumps(cfg), encoding='utf-8')
          PY
      - name: Run wildcard-schema tool and delegation trajectory
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COPILOT_OTEL_FILE_EXPORTER_PATH: ${{ runner.temp }}/otel.jsonl
          COPILOT_OTEL_CAPTURE_CONTENT: 'false'
          TASK_PROMPT: >-
            V1.1 WILDCARD SCHEMA MCP GATE. Read-only task. First use the configured v11gate echo MCP
            tool with value `repeat-${{ matrix.repeat }}` and report its exact returned marker. Then discover,
            without editing or running shell commands, how this repository's OTel analyzer preserves
            trace-qualified ancestry across `analyze_otel` and the tool-ownership adapter. The concrete source
            and test paths are intentionally not supplied, so the repository mapping requires unknown semantic
            discovery and should use Luna Architect. No implementation is expected, so a sufficient Architect
            packet should have MUTATION_TARGETS: none and Main should synthesize without replaying repo reads.
            Do not invoke premium review.
        run: |
          set -o pipefail
          copilot \
            --plugin-dir="${RUNNER_TEMP}/wildcard-plugin" \
            --agent='over-the-luna:over-the-luna' \
            --model=gpt-5.6-luna \
            --additional-mcp-config="@${RUNNER_TEMP}/mcp.json" \
            --allow-all-tools \
            --allow-all-mcp-server-instructions \
            --max-ai-credits=30 \
            --no-remote-export \
            --output-format=json \
            --prompt="$TASK_PROMPT" \
            | tee "${RUNNER_TEMP}/output.jsonl"
      - name: Summarize trace and ownership
        if: always()
        run: |
          set -euo pipefail
          python scripts/analyze_otel.py "${RUNNER_TEMP}/otel.jsonl" --events "${RUNNER_TEMP}/output.jsonl" --json > "${RUNNER_TEMP}/summary.json"
          python scripts/analyze_tool_ownership.py "${RUNNER_TEMP}/otel.jsonl" > "${RUNNER_TEMP}/ownership.json"
      - name: Enforce wildcard MCP gate
        if: always()
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          s = json.loads((root / 'summary.json').read_text())
          o = json.loads((root / 'ownership.json').read_text())
          text = (root / 'output.jsonl').read_text(encoding='utf-8')
          expected = 'WILDCARD_MCP_OK:repeat-${{ matrix.repeat }}'
          assert expected in text, {'missing_mcp_marker': expected, 'tools': s.get('tools', {})}
          agents = {name.split(':')[-1].lower().replace('_','-'): count for name, count in s.get('agents', {}).items()}
          architect = agents.get('luna architect', 0) + agents.get('luna-architect', 0)
          assert s.get('mode') == 'STANDARD', s
          assert architect == 1, agents
          assert s.get('reviewer_invocations', 0) == 0, s
          assert s.get('first_mutation_tool') is None, s
          main = o.get('main', {})
          assert main.get('task', 0) == 1, main
          mcp_tools = {k:v for k,v in main.items() if 'v11gate' in k.lower() or 'echo' in k.lower()}
          assert mcp_tools, {'main_tools': main, 'all_tools': s.get('tools', {})}
          forbidden = {k:v for k,v in main.items() if k in {'view','glob','rg','search','grep'} and v}
          assert not forbidden, {'main_repo_rehydration': forbidden, 'ownership': o}
          assert 'Boundary sealed — work set: none' in text
          print('WILDCARD_SCHEMA_MCP_GATE=PASS')
          print(json.dumps({'agents': agents, 'main_tools': main, 'mcp_tools': mcp_tools}, indent=2))
          PY
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wildcard-schema-mcp-${{ matrix.repeat }}
          path: |
            ${{ runner.temp }}/output.jsonl
            ${{ runner.temp }}/otel.jsonl
            ${{ runner.temp }}/summary.json
            ${{ runner.temp }}/ownership.json
            ${{ runner.temp }}/mcp.json
          if-no-files-found: warn
