name: v1.1 one-shot exact ambient RC MCP gate

# ONE-SHOT PAID RESEARCH WORKFLOW. Delete immediately after launch.
on:
  pull_request:
    paths:
      - '.github/workflows/v1_1_ambient_mcp_once.yml'
  workflow_dispatch:

permissions:
  contents: read
  copilot-requests: write

jobs:
  ambient-mcp:
    strategy:
      fail-fast: false
      matrix:
        repeat: [1, 2]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: rc/v1.1-vscode-gate-ambient
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install Copilot CLI and MCP SDK
        run: |
          npm install -g @github/copilot
          python -m pip install mcp
          copilot --version | tee "${RUNNER_TEMP}/copilot-version.txt"
      - name: Create harmless developer-selected MCP fixture
        run: |
          set -euo pipefail
          cat > "${RUNNER_TEMP}/v11_gate_mcp.py" <<'PY'
          from mcp.server.fastmcp import FastMCP
          server = FastMCP('v11gate')

          @server.tool()
          def echo(value: str) -> str:
              """Return a deterministic marker for ambient tool-inheritance testing."""
              return f'AMBIENT_MCP_OK:{value}'

          if __name__ == '__main__':
              server.run(transport='stdio')
          PY
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          cfg = {'mcpServers': {'v11gate': {'type': 'local', 'command': 'python', 'args': [str(root/'v11_gate_mcp.py')], 'tools': ['*']}}}
          (root/'mcp.json').write_text(json.dumps(cfg), encoding='utf-8')
          PY
      - name: Run exact ambient RC tool trajectory
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COPILOT_OTEL_FILE_EXPORTER_PATH: ${{ runner.temp }}/otel.jsonl
          COPILOT_OTEL_CAPTURE_CONTENT: 'false'
          TASK_PROMPT: >-
            V1.1 AMBIENT MCP INHERITANCE GATE. This is a harmless configured-tool task, not a repository
            implementation task. Use the developer-configured `v11gate` echo MCP tool exactly once with value
            `repeat-${{ matrix.repeat }}` and report its exact returned marker. Follow the installed Over the Luna
            policy normally: a bounded configured integration task may use Luna Tool Worker if appropriate, but do
            not inspect or edit repository files, do not use shell as a substitute, do not invoke unrelated agents,
            and do not invoke Premium Review. If the MCP tool is unavailable, report that explicitly rather than
            bypassing the configured tool boundary.
        run: |
          set -o pipefail
          copilot \
            --plugin-dir=. \
            --agent='over-the-luna:over-the-luna' \
            --model=gpt-5.6-luna \
            --additional-mcp-config="@${RUNNER_TEMP}/mcp.json" \
            --allow-all-tools \
            --allow-all-mcp-server-instructions \
            --max-ai-credits=30 \
            --no-remote-export \
            --output-format=json \
            --prompt="$TASK_PROMPT" \
            | tee "${RUNNER_TEMP}/output.jsonl"
      - name: Summarize trajectory
        if: always()
        run: |
          set -euo pipefail
          python scripts/analyze_otel.py "${RUNNER_TEMP}/otel.jsonl" --events "${RUNNER_TEMP}/output.jsonl" --json > "${RUNNER_TEMP}/summary.json"
          python scripts/analyze_tool_ownership.py "${RUNNER_TEMP}/otel.jsonl" > "${RUNNER_TEMP}/ownership.json"
      - name: Enforce ambient MCP inheritance
        if: always()
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          s = json.loads((root/'summary.json').read_text())
          o = json.loads((root/'ownership.json').read_text())
          text = (root/'output.jsonl').read_text(encoding='utf-8')
          marker = 'AMBIENT_MCP_OK:repeat-${{ matrix.repeat }}'
          assert marker in text, {'missing_marker': marker, 'tools': s.get('tools', {})}
          mcp_calls = sum(v for k,v in s.get('tools', {}).items() if 'v11gate' in k.lower() or 'echo' in k.lower())
          assert mcp_calls == 1, {'mcp_calls': mcp_calls, 'tools': s.get('tools', {})}
          assert s.get('first_mutation_tool') is None, s
          assert s.get('reviewer_invocations', 0) == 0, s
          agents = {name.split(':')[-1].lower().replace('_','-'): count for name,count in s.get('agents', {}).items()}
          unrelated = {k:v for k,v in agents.items() if k not in {'over-the-luna','luna tool worker','luna-tool-worker'} and v}
          assert not unrelated, unrelated
          worker = agents.get('luna tool worker', 0) + agents.get('luna-tool-worker', 0)
          assert worker <= 1, {'worker_invocations': worker, 'agents': agents}
          repo_reads = sum(v for k,v in s.get('tools', {}).items() if k in {'view','glob','rg','search','grep'})
          assert repo_reads == 0, {'repo_reads': repo_reads, 'tools': s.get('tools', {})}
          print('AMBIENT_MCP_GATE=PASS')
          print(json.dumps({'agents': agents, 'tools': s.get('tools', {}), 'ownership': o}, indent=2))
          PY
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ambient-mcp-${{ matrix.repeat }}
          path: |
            ${{ runner.temp }}/copilot-version.txt
            ${{ runner.temp }}/mcp.json
            ${{ runner.temp }}/output.jsonl
            ${{ runner.temp }}/otel.jsonl
            ${{ runner.temp }}/summary.json
            ${{ runner.temp }}/ownership.json
          if-no-files-found: warn
