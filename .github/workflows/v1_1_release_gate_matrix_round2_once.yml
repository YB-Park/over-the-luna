name: v1.1 one-shot release gate matrix round 2

# ONE-SHOT PAID RESEARCH WORKFLOW. Delete after artifact collection.
on:
  pull_request:
    paths:
      - '.github/workflows/v1_1_release_gate_matrix_round2_once.yml'
  workflow_dispatch:

permissions:
  contents: read
  copilot-requests: write

jobs:
  release-gate:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        case: [tiny, local, broad, risk]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install Copilot CLI
        run: |
          npm install -g @github/copilot
          copilot --version

      - name: Prepare integrated candidate plugin
        run: |
          set -euo pipefail
          cp -a "$GITHUB_WORKSPACE" "${RUNNER_TEMP}/plugin"
          cp "$GITHUB_WORKSPACE/experiments/v1_1_candidate_integrated.agent.md" \
             "${RUNNER_TEMP}/plugin/agents/over-the-luna.agent.md"
          cp "$GITHUB_WORKSPACE/experiments/v1_1_candidate_architect_packet.agent.md" \
             "${RUNNER_TEMP}/plugin/agents/luna-architect.agent.md"
          cp "$GITHUB_WORKSPACE/experiments/v1_1_candidate_invariant_reviewer.agent.md" \
             "${RUNNER_TEMP}/plugin/agents/luna-reviewer.agent.md"

      - name: Generate release-gate fixture
        run: |
          python "$GITHUB_WORKSPACE/experiments/v1_1_release_gate_fixture.py" prepare \
            --case '${{ matrix.case }}' \
            --root "${RUNNER_TEMP}/fixture" \
            --task-file "${RUNNER_TEMP}/task.txt"
          cd "${RUNNER_TEMP}/fixture"
          git init -q
          git config user.name fixture
          git config user.email fixture@example.invalid
          git add .
          git commit -qm baseline

      - name: Run candidate trajectory
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COPILOT_OTEL_FILE_EXPORTER_PATH: ${{ runner.temp }}/otel.jsonl
          COPILOT_OTEL_CAPTURE_CONTENT: 'false'
        run: |
          set -o pipefail
          cd "${RUNNER_TEMP}/fixture"
          TASK_PROMPT="$(cat "${RUNNER_TEMP}/task.txt")"
          copilot \
            --plugin-dir="${RUNNER_TEMP}/plugin" \
            --agent='over-the-luna:over-the-luna' \
            --model=gpt-5.6-luna \
            --available-tools='view,glob,rg,apply_patch,bash,task,list_agents,read_agent' \
            --allow-all-tools \
            --max-ai-credits=30 \
            --no-remote-export \
            --output-format=json \
            --prompt="$TASK_PROMPT" \
            | tee "${RUNNER_TEMP}/output.jsonl"

      - name: Capture final patch
        if: always()
        run: |
          git -C "${RUNNER_TEMP}/fixture" diff --no-ext-diff > "${RUNNER_TEMP}/candidate.diff"
          git -C "${RUNNER_TEMP}/fixture" status --short > "${RUNNER_TEMP}/fixture-status.txt"

      - name: Run visible tests
        if: always()
        run: |
          set +e
          cd "${RUNNER_TEMP}/fixture"
          python -m unittest discover -s tests -v > "${RUNNER_TEMP}/visible-tests.txt" 2>&1
          echo "$?" > "${RUNNER_TEMP}/visible-tests.exit"
          cat "${RUNNER_TEMP}/visible-tests.txt"
          exit 0

      - name: Run hidden acceptance oracle
        if: always()
        run: |
          set +e
          python "$GITHUB_WORKSPACE/experiments/v1_1_release_gate_fixture.py" hidden \
            --case '${{ matrix.case }}' \
            --root "${RUNNER_TEMP}/fixture" \
            > "${RUNNER_TEMP}/hidden-tests.txt" 2>&1
          echo "$?" > "${RUNNER_TEMP}/hidden-tests.exit"
          cat "${RUNNER_TEMP}/hidden-tests.txt"
          exit 0

      - name: Summarize policy trace
        if: always()
        run: |
          set +e
          if [ -f "${RUNNER_TEMP}/otel.jsonl" ]; then
            python "$GITHUB_WORKSPACE/scripts/analyze_otel.py" \
              "${RUNNER_TEMP}/otel.jsonl" --events "${RUNNER_TEMP}/output.jsonl" \
              > "${RUNNER_TEMP}/policy-summary.md"
            python "$GITHUB_WORKSPACE/scripts/analyze_tool_ownership.py" \
              "${RUNNER_TEMP}/otel.jsonl" > "${RUNNER_TEMP}/policy-tool-ownership.json"
          fi
          exit 0

      - name: Evaluate routing and ownership contract
        if: always()
        run: |
          set +e
          python "$GITHUB_WORKSPACE/experiments/v1_1_release_gate_fixture.py" evaluate \
            --case '${{ matrix.case }}' \
            --events "${RUNNER_TEMP}/output.jsonl" \
            --ownership "${RUNNER_TEMP}/policy-tool-ownership.json" \
            > "${RUNNER_TEMP}/policy-gate.txt" 2>&1
          echo "$?" > "${RUNNER_TEMP}/policy-gate.exit"
          cat "${RUNNER_TEMP}/policy-gate.txt"
          exit 0

      - name: Upload release-gate artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-gate-r2-${{ matrix.case }}
          path: |
            ${{ runner.temp }}/task.txt
            ${{ runner.temp }}/output.jsonl
            ${{ runner.temp }}/otel.jsonl
            ${{ runner.temp }}/policy-summary.md
            ${{ runner.temp }}/policy-tool-ownership.json
            ${{ runner.temp }}/policy-gate.txt
            ${{ runner.temp }}/policy-gate.exit
            ${{ runner.temp }}/candidate.diff
            ${{ runner.temp }}/fixture-status.txt
            ${{ runner.temp }}/visible-tests.txt
            ${{ runner.temp }}/visible-tests.exit
            ${{ runner.temp }}/hidden-tests.txt
            ${{ runner.temp }}/hidden-tests.exit
          if-no-files-found: warn

      - name: Enforce release gate
        if: always()
        run: |
          visible="$(cat "${RUNNER_TEMP}/visible-tests.exit" 2>/dev/null || echo 99)"
          hidden="$(cat "${RUNNER_TEMP}/hidden-tests.exit" 2>/dev/null || echo 99)"
          policy="$(cat "${RUNNER_TEMP}/policy-gate.exit" 2>/dev/null || echo 99)"
          echo "visible=$visible hidden=$hidden policy=$policy"
          test "$visible" = 0
          test "$hidden" = 0
          test "$policy" = 0
