name: Validate v1.1.1 surface economy release candidate

on:
  push:
    branches:
      - run/v1.1.1-surface-economy-final
    paths:
      - .github/workflows/validate_surface_economy_release.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release candidate
        uses: actions/checkout@v6
        with:
          ref: release/v1.1.1-surface-economy
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install validator dependency
        run: python -m pip install 'PyYAML==6.0.2'

      - name: Validate release contract
        run: |
          python -m compileall -q scripts
          python scripts/validate_plugin.py

      - name: Verify release diff scope
        run: |
          git fetch origin main --quiet
          git diff --name-status origin/main...HEAD | tee "$RUNNER_TEMP/release-diff.txt"
          python - <<'PY'
          import os
          from pathlib import Path
          allowed = {
              'CHANGELOG.md',
              'agents/over-the-luna.agent.md',
              'plugin.json',
              'scripts/validate_plugin.py',
              '.github/workflows/v1_1_1_surface_economy.yml',
              '.github/workflows/v1_1_1_surface_economy_phase2.yml',
          }
          lines = Path(os.environ['RUNNER_TEMP'], 'release-diff.txt').read_text().splitlines()
          paths = {line.split('\t')[-1] for line in lines if line.strip()}
          if paths != allowed:
              raise SystemExit(f'release diff scope mismatch: {sorted(paths)}')
          print('Release diff scope OK:', sorted(paths))
          PY

      - name: Record validation run id on trigger branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git checkout run/v1.1.1-surface-economy-final
          printf '%s\n' '${{ github.run_id }}' > release_candidate_validation_run_id.txt
          printf 'https://github.com/${{ github.repository }}/actions/runs/%s\n' '${{ github.run_id }}' > release_candidate_validation_run_url.txt
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git config user.name 'github-actions[bot]'
          git add -- release_candidate_validation_run_id.txt release_candidate_validation_run_url.txt
          git commit -m 'Record release candidate validation run' || exit 0
          git push
