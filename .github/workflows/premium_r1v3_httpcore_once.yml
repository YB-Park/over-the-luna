name: Premium harness R1-v3 httpcore one-shot

on:
  push:
    branches:
      - experiment/premium-luna-orchestration
    paths:
      - .github/workflows/premium_r1v3_httpcore_once.yml

permissions:
  contents: read
  copilot-requests: write

jobs:
  r1v3-httpcore:
    runs-on: ubuntu-latest
    steps:
      - name: Check out experiment harness
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install tooling
        run: |
          npm install -g @github/copilot
          copilot --version | tee "${{ runner.temp }}/copilot-version.txt"
          python -m pip install --upgrade pip
          python -m pip install             'h11>=0.13,<0.15' 'sniffio==1.*' 'anyio==3.6.2' certifi             'trio==0.21.0' 'pytest==7.2.0' 'pytest-trio==0.7.0'             'h2>=3,<5' 'socksio==1.*'

      - name: Snapshot premium plugin
        run: |
          mkdir -p "${{ runner.temp }}/otl-plugin"
          cp plugin.json "${{ runner.temp }}/otl-plugin/plugin.json"
          cp -R agents "${{ runner.temp }}/otl-plugin/agents"

      - name: Prepare shallow historical workspace
        run: |
          dir="${{ runner.temp }}/httpcore-r1v3"
          mkdir -p "$dir"
          cd "$dir"
          git init -q
          git remote add origin https://github.com/encode/httpcore.git
          git fetch -q --depth=1 origin 5f2e454801f50051d5a66203401a67e5b2a32e9d
          git checkout -q --detach FETCH_HEAD
          test -z "$(git status --porcelain)"
          git rev-list --count HEAD | tee "${{ runner.temp }}/history-count.txt"

      - name: Run Premium Harness regression v3
        working-directory: ${{ runner.temp }}/httpcore-r1v3
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COPILOT_OTEL_FILE_EXPORTER_PATH: ${{ runner.temp }}/premium-r1v3-otel.jsonl
          COPILOT_OTEL_CAPTURE_CONTENT: 'false'
          TASK_PROMPT: >-
            PREMIUM HARNESS REGRESSION LAB R1-v3. This is an already-known historical case
            used only to test harness behavior, not promotion quality. Do not inspect git
            history or use external services. This snapshot intermittently fails during
            concurrent async HTTP use with RuntimeError: dictionary changed size during
            iteration while importing anyio from httpcore/_synchronization.py, typically from
            AsyncLock.setup() under asyncio. After that failure, cleanup can also hit
            AttributeError because _anyio_lock was never initialized. The failure is
            timing-sensitive and has been observed more often under a debugger. Fix the
            repository-local defect with the smallest robust intervention while preserving
            asyncio/anyio, trio, and missing-backend behavior. Add focused regression coverage
            if justified and run relevant tests. Do not assume a later patch or PR exists.
            Do not preselect a synchronization mechanism: let Luna Builder own local causal
            diagnosis and implementation choice. Prefer structural simplification over new
            coordination state when it satisfies the same contract.
        run: |
          set -o pipefail
          copilot             --plugin-dir="${{ runner.temp }}/otl-plugin"             --agent='over-the-luna:premium-harness'             --model=gpt-5.6-terra             --available-tools='view,glob,rg,apply_patch,bash,task,list_agents,read_agent'             --allow-all-tools             --max-ai-credits=60             --no-remote-export             --output-format=json             --prompt="$TASK_PROMPT"             | tee "${{ runner.temp }}/premium-r1v3-output.jsonl"

          git diff --no-ext-diff > "${{ runner.temp }}/premium-r1v3.diff"
          git status --short > "${{ runner.temp }}/premium-r1v3.status"

      - name: Run focused tests
        if: always()
        working-directory: ${{ runner.temp }}/httpcore-r1v3
        run: |
          set +e
          PYTHONPATH=. python -m pytest -q             tests/_async/test_connection.py             tests/_async/test_connection_pool.py             tests/_async/test_http2.py             tests/_async/test_http_proxy.py             tests/_async/test_socks_proxy.py             > "${{ runner.temp }}/premium-r1v3-tests.txt" 2>&1
          code=$?
          echo "$code" > "${{ runner.temp }}/premium-r1v3-tests.exit"
          cat "${{ runner.temp }}/premium-r1v3-tests.txt"
          exit 0

      - name: Run accepted-direction oracle
        if: always()
        working-directory: ${{ runner.temp }}/httpcore-r1v3
        run: |
          set +e
          python - <<'PY' > "${{ runner.temp }}/premium-r1v3-oracle.txt" 2>&1
          import re
          from pathlib import Path

          text = Path("httpcore/_synchronization.py").read_text()
          lines = text.splitlines()

          lazy = [
              line for line in lines
              if re.match(r"^\s{8,}import\s+(?:anyio|trio)\b", line)
          ]
          assert not lazy, f"lazy backend imports remain: {lazy}"

          assert re.search(r"(?m)^\s{4}import anyio\s*$", text), "no module-level conditional anyio import"
          assert re.search(r"(?m)^\s{4}import trio\s*$", text), "no module-level conditional trio import"

          anyio_at = text.find("import anyio")
          trio_at = text.find("import trio")
          assert anyio_at >= 0 and trio_at >= 0
          assert "except ImportError" in text[max(0, anyio_at-100):anyio_at+240]
          assert "except ImportError" in text[max(0, trio_at-100):trio_at+240]

          assert "threading.Lock" not in text, "new lock machinery survived"
          assert "_import_anyio" not in text, "custom lazy import machinery survived"
          print("R1_ACCEPTED_DIRECTION_PASS")
          PY
          code=$?
          echo "$code" > "${{ runner.temp }}/premium-r1v3-oracle.exit"
          cat "${{ runner.temp }}/premium-r1v3-oracle.txt"
          exit "$code"

      - name: Upload R1-v3 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: premium-harness-r1v3-httpcore
          path: |
            ${{ runner.temp }}/copilot-version.txt
            ${{ runner.temp }}/history-count.txt
            ${{ runner.temp }}/premium-r1v3-output.jsonl
            ${{ runner.temp }}/premium-r1v3-otel.jsonl
            ${{ runner.temp }}/premium-r1v3.diff
            ${{ runner.temp }}/premium-r1v3.status
            ${{ runner.temp }}/premium-r1v3-tests.txt
            ${{ runner.temp }}/premium-r1v3-tests.exit
            ${{ runner.temp }}/premium-r1v3-oracle.txt
            ${{ runner.temp }}/premium-r1v3-oracle.exit
          if-no-files-found: warn
