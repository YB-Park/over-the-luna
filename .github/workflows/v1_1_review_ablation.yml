name: v1.1 fresh Luna review ablation

# Temporary one-shot trigger for the second bounded ablation. Revert to
# workflow_dispatch immediately after the artifact is captured.
on:
  pull_request:
    types: [synchronize]
    branches: [main]
    paths:
      - .github/workflows/v1_1_review_ablation.yml

permissions:
  contents: read
  copilot-requests: write

jobs:
  exact-patch-review-ablation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out research branch
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          python -m pip install 'PyYAML==6.0.2'
          npm install -g @github/copilot
          copilot --version

      - name: Run current-policy implementation
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COPILOT_OTEL_FILE_EXPORTER_PATH: ${{ runner.temp }}/main-otel.jsonl
          COPILOT_OTEL_CAPTURE_CONTENT: 'false'
          TASK_PROMPT: >-
            V1.1 CONTROLLED MUTATION EXPERIMENT. Add a focused repository runtime contract that
            prevents accidental automatic execution of paid Copilot workflows. Any workflow under
            .github/workflows that requests `copilot-requests: write` must be manual-only:
            `workflow_dispatch` must be present and automatic/event triggers such as push,
            pull_request, schedule, or workflow_run must be rejected. Add regression coverage that
            proves a representative invalid automatic-trigger workflow would fail without modifying
            a real workflow as part of the test. Keep the implementation focused in
            tests/test_runtime_contract.py unless a tiny reusable helper is genuinely needed.
            Existing non-paid validation workflows must remain unaffected. Run the focused tests.
            Follow the installed Over the Luna routing/review policy normally; do not add Council
            calls merely because this is an experiment. Do not use or request premium review.
        run: |
          set -o pipefail
          copilot \
            --plugin-dir=. \
            --agent='over-the-luna:over-the-luna' \
            --model=gpt-5.6-luna \
            --available-tools='view,glob,rg,apply_patch,bash,task,list_agents,read_agent' \
            --allow-all-tools \
            --max-ai-credits=30 \
            --no-remote-export \
            --output-format=json \
            --prompt="$TASK_PROMPT" \
            | tee "${{ runner.temp }}/main-output.jsonl"

      - name: Capture exact pre-review artifact
        if: always()
        run: |
          git diff --no-ext-diff > "${{ runner.temp }}/pre-review.diff"
          git status --short > "${{ runner.temp }}/pre-review-status.txt"
          sha256sum "${{ runner.temp }}/pre-review.diff" > "${{ runner.temp }}/pre-review.diff.sha256"

      - name: Validate pre-review artifact
        if: always()
        run: |
          set +e
          python -m unittest discover -s tests -v > "${{ runner.temp }}/pre-review-validation.txt" 2>&1
          code=$?
          echo "$code" > "${{ runner.temp }}/pre-review-validation.exit"
          cat "${{ runner.temp }}/pre-review-validation.txt"
          exit 0

      - name: Summarize current-policy trace
        if: always()
        run: |
          if [ -f "${{ runner.temp }}/main-otel.jsonl" ]; then
            python scripts/analyze_otel.py \
              "${{ runner.temp }}/main-otel.jsonl" \
              --events "${{ runner.temp }}/main-output.jsonl" \
              | tee "${{ runner.temp }}/main-summary.md"
          fi

      - name: Build identical-artifact review prompt
        if: always()
        run: |
          {
            cat <<'EOF'
          V1.1 REVIEW ABLATION. This is an independent read-only review of an exact completed patch.

          Original requirement:
          Add a runtime contract for .github/workflows: any workflow requesting
          `permissions.copilot-requests: write` must include `workflow_dispatch` and reject automatic
          triggers such as push, pull_request, schedule, or workflow_run. Regression coverage must
          prove a representative invalid workflow is rejected without mutating a real workflow.
          Non-paid validation workflows must remain unaffected.

          Rubric:
          1. semantic correctness of paid-workflow detection;
          2. trigger parsing correctness for real GitHub Actions YAML;
          3. negative regression test actually proves the guard can fail;
          4. no false positives for non-paid workflows;
          5. maintainability and scope.

          Inspect repository evidence when the diff depends on unchanged helper/parser behavior.
          Do not edit files or run commands. Do not recommend premium review. Return PASS or only
          concrete actionable findings, and distinguish must-fix from should-fix.

          Pre-review validation output:
          EOF
            cat "${{ runner.temp }}/pre-review-validation.txt" 2>/dev/null || true
            echo
            echo 'Exact patch:'
            cat "${{ runner.temp }}/pre-review.diff" 2>/dev/null || true
          } > "${{ runner.temp }}/review-prompt.txt"

      - name: Run exactly one fresh Luna Reviewer
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COPILOT_OTEL_FILE_EXPORTER_PATH: ${{ runner.temp }}/review-otel.jsonl
          COPILOT_OTEL_CAPTURE_CONTENT: 'false'
        run: |
          set -o pipefail
          copilot \
            --plugin-dir=. \
            --agent='over-the-luna:luna-reviewer' \
            --model=gpt-5.6-luna \
            --available-tools='view,glob,rg' \
            --allow-all-tools \
            --max-ai-credits=30 \
            --no-remote-export \
            --output-format=json \
            --prompt="$(cat "${{ runner.temp }}/review-prompt.txt")" \
            | tee "${{ runner.temp }}/review-output.jsonl"

      - name: Prove forced reviewer did not mutate
        if: always()
        run: |
          git diff --no-ext-diff > "${{ runner.temp }}/post-review.diff"
          sha256sum "${{ runner.temp }}/post-review.diff" > "${{ runner.temp }}/post-review.diff.sha256"
          if ! cmp -s "${{ runner.temp }}/pre-review.diff" "${{ runner.temp }}/post-review.diff"; then
            echo 'ERROR: read-only reviewer changed the working tree.' >&2
            exit 1
          fi

      - name: Summarize forced-review trace
        if: always()
        run: |
          if [ -f "${{ runner.temp }}/review-otel.jsonl" ]; then
            python scripts/analyze_otel.py \
              "${{ runner.temp }}/review-otel.jsonl" \
              --events "${{ runner.temp }}/review-output.jsonl" \
              | tee "${{ runner.temp }}/review-summary.md"
          fi

      - name: Upload ablation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v1.1-review-ablation-paid-workflow-guard
          path: |
            ${{ runner.temp }}/main-output.jsonl
            ${{ runner.temp }}/main-otel.jsonl
            ${{ runner.temp }}/main-summary.md
            ${{ runner.temp }}/pre-review.diff
            ${{ runner.temp }}/pre-review.diff.sha256
            ${{ runner.temp }}/pre-review-status.txt
            ${{ runner.temp }}/pre-review-validation.txt
            ${{ runner.temp }}/pre-review-validation.exit
            ${{ runner.temp }}/review-prompt.txt
            ${{ runner.temp }}/review-output.jsonl
            ${{ runner.temp }}/review-otel.jsonl
            ${{ runner.temp }}/review-summary.md
            ${{ runner.temp }}/post-review.diff
            ${{ runner.temp }}/post-review.diff.sha256
          if-no-files-found: warn
