name: Terra paired bug eval 2 one-shot

# ONE-SHOT PAID MODEL-ISOLATION PROBE.
on:
  push:
    branches:
      - experiment/terra-deep-judgment
    paths:
      - .github/workflows/terra_bug2_once.yml

permissions:
  contents: read
  copilot-requests: write

jobs:
  bug2:
    runs-on: ubuntu-latest
    steps:
      - name: Check out experiment harness
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install Copilot CLI
        run: |
          npm install -g @github/copilot
          copilot --version | tee "${{ runner.temp }}/copilot-version.txt"

      - name: Snapshot experiment plugin
        run: |
          mkdir -p "${{ runner.temp }}/otl-plugin"
          cp plugin.json "${{ runner.temp }}/otl-plugin/plugin.json"
          cp -R agents "${{ runner.temp }}/otl-plugin/agents"

      - name: Prepare historical aiohttp retry workspace
        run: |
          cd "${{ runner.temp }}"
          git clone --quiet https://github.com/aio-libs/aiohttp.git aiohttp-bug2
          cd aiohttp-bug2
          git checkout --quiet 6264834e7023aadd85646fd79637942b9edbe22b
          git status --short > "${{ runner.temp }}/bug2-pre-status.txt"
          test -z "$(git status --porcelain)"

      - name: Run paired Luna control
        working-directory: ${{ runner.temp }}/aiohttp-bug2
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COPILOT_OTEL_FILE_EXPORTER_PATH: ${{ runner.temp }}/bug2-luna-otel.jsonl
          COPILOT_OTEL_CAPTURE_CONTENT: 'false'
          TASK_PROMPT: >-
            MODEL-ISOLATION DATA-INTEGRITY JUDGMENT. READ-ONLY. Do not edit files,
            run shell commands, inspect git history, or use external services.
            Historical symptom: an internally retried PUT request whose data is an
            already-open file object can silently send only the unread remainder of
            the file on the retry after ClientOSError or ServerDisconnectedError.
            The file position has advanced during the failed attempt. We must fix this
            without making partially-consumed non-seekable/async-iterable bodies look
            safely replayable. Determine the concrete causal lifecycle in this repository
            snapshot, discriminate rebuild-vs-reuse-vs-rewind approaches, define how
            replayability/consumed state must behave across file, async iterable, and
            multipart bodies, and produce the smallest safe execution contract plus
            regressions. Do not implement and do not assume a later patch exists. Use
            evidence leaves only when they materially help. Follow the Deep Judgment
            output sections exactly.
        run: |
          set -o pipefail
          copilot             --plugin-dir="${{ runner.temp }}/otl-plugin"             --agent='over-the-luna:deep-judgment-luna-control'             --model=gpt-5.6-luna             --available-tools='view,glob,rg,task,list_agents,read_agent'             --allow-all-tools             --max-ai-credits=30             --no-remote-export             --output-format=json             --prompt="$TASK_PROMPT"             | tee "${{ runner.temp }}/bug2-luna-output.jsonl"
          test -z "$(git status --porcelain)"

      - name: Run paired Terra candidate
        working-directory: ${{ runner.temp }}/aiohttp-bug2
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COPILOT_OTEL_FILE_EXPORTER_PATH: ${{ runner.temp }}/bug2-terra-otel.jsonl
          COPILOT_OTEL_CAPTURE_CONTENT: 'false'
          TASK_PROMPT: >-
            MODEL-ISOLATION DATA-INTEGRITY JUDGMENT. READ-ONLY. Do not edit files,
            run shell commands, inspect git history, or use external services.
            Historical symptom: an internally retried PUT request whose data is an
            already-open file object can silently send only the unread remainder of
            the file on the retry after ClientOSError or ServerDisconnectedError.
            The file position has advanced during the failed attempt. We must fix this
            without making partially-consumed non-seekable/async-iterable bodies look
            safely replayable. Determine the concrete causal lifecycle in this repository
            snapshot, discriminate rebuild-vs-reuse-vs-rewind approaches, define how
            replayability/consumed state must behave across file, async iterable, and
            multipart bodies, and produce the smallest safe execution contract plus
            regressions. Do not implement and do not assume a later patch exists. Use
            evidence leaves only when they materially help. Follow the Deep Judgment
            output sections exactly.
        run: |
          set -o pipefail
          copilot             --plugin-dir="${{ runner.temp }}/otl-plugin"             --agent='over-the-luna:deep-judgment'             --model=gpt-5.6-terra             --available-tools='view,glob,rg,task,list_agents,read_agent'             --allow-all-tools             --max-ai-credits=30             --no-remote-export             --output-format=json             --prompt="$TASK_PROMPT"             | tee "${{ runner.temp }}/bug2-terra-output.jsonl"
          test -z "$(git status --porcelain)"

      - name: Upload paired bug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terra-paired-bug2-aiohttp-retry-body-integrity
          path: |
            ${{ runner.temp }}/copilot-version.txt
            ${{ runner.temp }}/bug2-luna-output.jsonl
            ${{ runner.temp }}/bug2-luna-otel.jsonl
            ${{ runner.temp }}/bug2-terra-output.jsonl
            ${{ runner.temp }}/bug2-terra-otel.jsonl
            ${{ runner.temp }}/bug2-pre-status.txt
          if-no-files-found: warn
