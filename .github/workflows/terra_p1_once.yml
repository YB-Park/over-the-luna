name: Terra P1 A-B one-shot

# ONE-SHOT PAID HISTORICAL REPLAY. Launches one fixed-SHA A/B decision test,
# then the workflow file is deleted immediately.
on:
  push:
    branches:
      - experiment/terra-deep-judgment
    paths:
      - .github/workflows/terra_p1_once.yml

permissions:
  contents: read
  copilot-requests: write

jobs:
  p1:
    runs-on: ubuntu-latest
    steps:
      - name: Check out experiment harness
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install Copilot CLI
        run: |
          npm install -g @github/copilot
          copilot --version | tee "${{ runner.temp }}/copilot-version.txt"

      - name: Snapshot current experiment plugin outside historical workspace
        run: |
          mkdir -p "${{ runner.temp }}/otl-plugin"
          cp plugin.json "${{ runner.temp }}/otl-plugin/plugin.json"
          cp -R agents "${{ runner.temp }}/otl-plugin/agents"

      - name: Check out historical pre-v0.6 workspace
        run: |
          git checkout --detach 8af8e03230808bc0baf73793727c2dad1964cd94
          git status --short
          test -z "$(git status --porcelain)"

      - name: Run A - Luna-only baseline
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COPILOT_OTEL_FILE_EXPORTER_PATH: ${{ runner.temp }}/p1-a-otel.jsonl
          COPILOT_OTEL_CAPTURE_CONTENT: 'false'
          P1_PROMPT: >-
            HISTORICAL DECISION REPLAY. READ-ONLY; do not edit files, run shell commands,
            or perform external side effects. Runtime symptom: a harmless MCP tool works in
            VS Code native Agent mode. Over the Luna correctly routes the same request to
            Luna Tool Worker, the worker can identify the workspace MCP configuration, and
            the MCP server is running, but the worker cannot call the MCP tool. Analyze the
            repository at this historical state and decide the structural cause and the
            smallest architecture correction. In particular decide which roles should
            explicitly declare tools, which roles should omit tools to preserve selected-tool
            inheritance, and whether the coordinator should directly execute environment tools.
            Do not rely on later repository history. Do not implement. Return a compact
            architecture decision, evidence, rejected plausible alternative, and residual risk.
        run: |
          set -o pipefail
          copilot             --plugin-dir="${{ runner.temp }}/otl-plugin"             --agent='over-the-luna:over-the-luna'             --model=gpt-5.6-luna             --available-tools='view,glob,rg,task,list_agents,read_agent'             --allow-all-tools             --max-ai-credits=30             --no-remote-export             --output-format=json             --prompt="$P1_PROMPT"             | tee "${{ runner.temp }}/p1-a-output.jsonl"
          test -z "$(git status --porcelain)"

      - name: Run B - Terra Deep Judgment candidate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COPILOT_OTEL_FILE_EXPORTER_PATH: ${{ runner.temp }}/p1-b-otel.jsonl
          COPILOT_OTEL_CAPTURE_CONTENT: 'false'
          P1_PROMPT: >-
            HISTORICAL DECISION REPLAY. READ-ONLY; do not edit files, run shell commands,
            or perform external side effects. Runtime symptom: a harmless MCP tool works in
            VS Code native Agent mode. Over the Luna correctly routes the same request to
            Luna Tool Worker, the worker can identify the workspace MCP configuration, and
            the MCP server is running, but the worker cannot call the MCP tool. Analyze the
            repository at this historical state and decide the structural cause and the
            smallest architecture correction. In particular decide which roles should
            explicitly declare tools, which roles should omit tools to preserve selected-tool
            inheritance, and whether the coordinator should directly execute environment tools.
            Do not rely on later repository history. Do not implement. Return the required
            Deep Judgment output contract.
        run: |
          set -o pipefail
          copilot             --plugin-dir="${{ runner.temp }}/otl-plugin"             --agent='over-the-luna:deep-judgment'             --model=gpt-5.6-terra             --available-tools='view,glob,rg,task,list_agents,read_agent'             --allow-all-tools             --max-ai-credits=30             --no-remote-export             --output-format=json             --prompt="$P1_PROMPT"             | tee "${{ runner.temp }}/p1-b-output.jsonl"
          test -z "$(git status --porcelain)"

      - name: Upload P1 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terra-p1-ab-historical-tool-inheritance
          path: |
            ${{ runner.temp }}/copilot-version.txt
            ${{ runner.temp }}/p1-a-output.jsonl
            ${{ runner.temp }}/p1-a-otel.jsonl
            ${{ runner.temp }}/p1-b-output.jsonl
            ${{ runner.temp }}/p1-b-otel.jsonl
          if-no-files-found: warn
