name: Premium held-out H1 redis hiredis

on:
  push:
    branches:
      - experiment/premium-luna-orchestration
    paths:
      - .github/workflows/premium_h1_once.yml

permissions:
  contents: read
  copilot-requests: write

jobs:
  h1:
    runs-on: ubuntu-latest
    steps:
      - name: Check out evaluation branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install Copilot CLI
        run: |
          npm install -g @github/copilot
          copilot --version | tee "${{ runner.temp }}/copilot-version.txt"

      - name: Materialize frozen agent plugins
        run: |
          mkdir -p "${{ runner.temp }}/plugin-otl" "${{ runner.temp }}/plugin-premium"
          git archive 814a069df188d28a564c4b05fbc441c2e3092d3d plugin.json agents             | tar -x -C "${{ runner.temp }}/plugin-otl"
          git archive 0083f3d81e7339f3b22e3efaa852562d7daa07e5 plugin.json agents             | tar -x -C "${{ runner.temp }}/plugin-premium"

      - name: Prepare historical Redis-py workspaces and dependencies
        run: |
          base="${{ runner.temp }}/h1-base"
          mkdir -p "$base"
          cd "$base"
          git init -q
          git remote add origin https://github.com/redis/redis-py.git
          git fetch -q --depth=1 origin b121809bd7c7107eedb6b9849180c83246419961
          git checkout -q --detach FETCH_HEAD
          test "$(git rev-list --count HEAD)" = "1"
          python -m pip install -q -r dev_requirements.txt 'hiredis>=3.2.0'

          cd "${{ runner.temp }}"
          cp -a h1-base h1-raw
          cp -a h1-base h1-premium
          cp -a h1-base h1-otl
          for d in h1-raw h1-premium h1-otl; do
            test -z "$(git -C "$d" status --porcelain)"
          done

      - name: Run B - raw Terra
        working-directory: ${{ runner.temp }}/h1-raw
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COPILOT_OTEL_FILE_EXPORTER_PATH: ${{ runner.temp }}/h1-raw-otel.jsonl
          COPILOT_OTEL_CAPTURE_CONTENT: 'false'
          TASK_PROMPT: >-
            HELD-OUT HISTORICAL CODING TASK. Work only in this repository snapshot.
            Do not inspect git history, branches, remotes, future commits, pull requests,
            or external services. With redis[hiredis] and protocol=3, a pooled connection
            that the server has closed can still be reported as readable and returned from
            the pool; the next command then raises "Connection closed by server" instead of
            transparently reconnecting. The issue does not reproduce with protocol=2+hiredis
            or with the pure-Python RESP3 parser. At the same time, a readable RESP3 connection
            may legitimately contain pending push data such as cache invalidations, and the
            fix must not consume or discard that data merely to check whether the peer closed.
            Diagnose the repository-level cause and implement the smallest robust fix. Preserve
            supported platform/socket behavior, existing parser contracts, and pending push
            processing. Add focused regression coverage and run relevant local tests. Do not
            assume a later patch exists.
        run: |
          start=$(date +%s)
          set -o pipefail
          copilot             --model=gpt-5.6-terra             --available-tools='view,glob,rg,apply_patch,bash,task,list_agents,read_agent'             --allow-all-tools             --no-ask-user             --max-ai-credits=100             --no-remote-export             --output-format=json             --prompt="$TASK_PROMPT"             | tee "${{ runner.temp }}/h1-raw-output.jsonl"
          code=$?
          end=$(date +%s)
          echo "$code" > "${{ runner.temp }}/h1-raw-agent.exit"
          echo "$((end-start))" > "${{ runner.temp }}/h1-raw-wall-seconds.txt"
          git diff --no-ext-diff > "${{ runner.temp }}/h1-raw.diff"
          git status --short > "${{ runner.temp }}/h1-raw.status"
          exit "$code"

      - name: Run C - frozen Premium Harness
        working-directory: ${{ runner.temp }}/h1-premium
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COPILOT_OTEL_FILE_EXPORTER_PATH: ${{ runner.temp }}/h1-premium-otel.jsonl
          COPILOT_OTEL_CAPTURE_CONTENT: 'false'
          TASK_PROMPT: >-
            HELD-OUT HISTORICAL CODING TASK. Work only in this repository snapshot.
            Do not inspect git history, branches, remotes, future commits, pull requests,
            or external services. With redis[hiredis] and protocol=3, a pooled connection
            that the server has closed can still be reported as readable and returned from
            the pool; the next command then raises "Connection closed by server" instead of
            transparently reconnecting. The issue does not reproduce with protocol=2+hiredis
            or with the pure-Python RESP3 parser. At the same time, a readable RESP3 connection
            may legitimately contain pending push data such as cache invalidations, and the
            fix must not consume or discard that data merely to check whether the peer closed.
            Diagnose the repository-level cause and implement the smallest robust fix. Preserve
            supported platform/socket behavior, existing parser contracts, and pending push
            processing. Add focused regression coverage and run relevant local tests. Do not
            assume a later patch exists.
        run: |
          start=$(date +%s)
          set -o pipefail
          copilot             --plugin-dir="${{ runner.temp }}/plugin-premium"             --agent='over-the-luna:premium-harness'             --model=gpt-5.6-terra             --available-tools='view,glob,rg,apply_patch,bash,task,list_agents,read_agent'             --allow-all-tools             --no-ask-user             --max-ai-credits=100             --no-remote-export             --output-format=json             --prompt="$TASK_PROMPT"             | tee "${{ runner.temp }}/h1-premium-output.jsonl"
          code=$?
          end=$(date +%s)
          echo "$code" > "${{ runner.temp }}/h1-premium-agent.exit"
          echo "$((end-start))" > "${{ runner.temp }}/h1-premium-wall-seconds.txt"
          git diff --no-ext-diff > "${{ runner.temp }}/h1-premium.diff"
          git status --short > "${{ runner.temp }}/h1-premium.status"
          exit "$code"

      - name: Run A - current Over the Luna
        working-directory: ${{ runner.temp }}/h1-otl
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COPILOT_OTEL_FILE_EXPORTER_PATH: ${{ runner.temp }}/h1-otl-otel.jsonl
          COPILOT_OTEL_CAPTURE_CONTENT: 'false'
          TASK_PROMPT: >-
            HELD-OUT HISTORICAL CODING TASK. Work only in this repository snapshot.
            Do not inspect git history, branches, remotes, future commits, pull requests,
            or external services. With redis[hiredis] and protocol=3, a pooled connection
            that the server has closed can still be reported as readable and returned from
            the pool; the next command then raises "Connection closed by server" instead of
            transparently reconnecting. The issue does not reproduce with protocol=2+hiredis
            or with the pure-Python RESP3 parser. At the same time, a readable RESP3 connection
            may legitimately contain pending push data such as cache invalidations, and the
            fix must not consume or discard that data merely to check whether the peer closed.
            Diagnose the repository-level cause and implement the smallest robust fix. Preserve
            supported platform/socket behavior, existing parser contracts, and pending push
            processing. Add focused regression coverage and run relevant local tests. Do not
            assume a later patch exists.
        run: |
          start=$(date +%s)
          set -o pipefail
          copilot             --plugin-dir="${{ runner.temp }}/plugin-otl"             --agent='over-the-luna:over-the-luna'             --model=gpt-5.6-luna             --available-tools='view,glob,rg,apply_patch,bash,task,list_agents,read_agent'             --allow-all-tools             --no-ask-user             --max-ai-credits=100             --no-remote-export             --output-format=json             --prompt="$TASK_PROMPT"             | tee "${{ runner.temp }}/h1-otl-output.jsonl"
          code=$?
          end=$(date +%s)
          echo "$code" > "${{ runner.temp }}/h1-otl-agent.exit"
          echo "$((end-start))" > "${{ runner.temp }}/h1-otl-wall-seconds.txt"
          git diff --no-ext-diff > "${{ runner.temp }}/h1-otl.diff"
          git status --short > "${{ runner.temp }}/h1-otl.status"
          exit "$code"

      - name: Fetch accepted test material after all model arms
        if: always()
        run: |
          oracle="${{ runner.temp }}/h1-oracle-repo"
          mkdir -p "$oracle"
          cd "$oracle"
          git init -q
          git remote add origin https://github.com/redis/redis-py.git
          git fetch -q --depth=1 origin 55d41593d3795080cdfc090ed56c19d9ab4ea3b1
          git show FETCH_HEAD:tests/test_connection.py > "${{ runner.temp }}/h1-accepted-test_connection.py"
          sha256sum "${{ runner.temp }}/h1-accepted-test_connection.py"             | tee "${{ runner.temp }}/h1-accepted-test.sha256"

      - name: Run identical hidden accepted tests on all arms
        if: always()
        run: |
          set +e
          expr='hiredis_can_read_returns_true_for_readable_open_socket or hiredis_can_read_raises_on_peer_closed_socket or hiredis_can_read_consumes_pending_push_before_reporting_closed or socket_is_closed_reports_not_closed_with_pending_ssl_data or socket_is_closed_detects_peer_close or socket_is_closed_detects_tcp_peer_half_close or socket_is_closed_defers_close_until_pending_data_is_read or socket_is_closed_without_poll_reports_not_closed'

          for arm in raw premium otl; do
            dir="${{ runner.temp }}/h1-$arm"
            cp "${{ runner.temp }}/h1-accepted-test_connection.py" "$dir/tests/test_connection.py"
            (
              cd "$dir"
              PYTHONPATH=. python -m pytest -q tests/test_connection.py -k "$expr"
            ) > "${{ runner.temp }}/h1-$arm-hidden.txt" 2>&1
            code=$?
            echo "$code" > "${{ runner.temp }}/h1-$arm-hidden.exit"
            echo "===== $arm hidden oracle exit=$code ====="
            cat "${{ runner.temp }}/h1-$arm-hidden.txt"
          done
          exit 0

      - name: Summarize H1 traces
        if: always()
        run: |
          python - <<'PY' > "${{ runner.temp }}/h1-trace-summary.json"
          import json
          from pathlib import Path

          root = Path(r"${{ runner.temp }}")
          result = {}
          for arm in ("raw", "premium", "otl"):
              p = root / f"h1-{arm}-output.jsonl"
              entry = {
                  "usage_credits": None,
                  "subagents": [],
                  "tool_starts": 0,
                  "models": [],
                  "wall_seconds": None,
                  "agent_exit": None,
                  "hidden_exit": None,
              }
              if p.exists():
                  for line in p.read_text(errors="replace").splitlines():
                      try:
                          e = json.loads(line)
                      except Exception:
                          continue
                      typ = e.get("type")
                      data = e.get("data") or {}
                      if typ == "session.usage_checkpoint":
                          nai = data.get("totalNanoAiu")
                          if isinstance(nai, (int, float)):
                              entry["usage_credits"] = nai / 1_000_000_000
                      elif typ == "subagent.completed":
                          entry["subagents"].append({
                              "agent": data.get("agentDisplayName") or data.get("agentName"),
                              "model": data.get("model"),
                              "tool_calls": data.get("totalToolCalls"),
                              "tokens": data.get("totalTokens"),
                              "duration_ms": data.get("durationMs"),
                          })
                      elif typ == "tool.execution_start":
                          entry["tool_starts"] += 1
                      elif typ == "model.call_start":
                          m = data.get("model")
                          if m and m not in entry["models"]:
                              entry["models"].append(m)
              for key, suffix in (
                  ("wall_seconds", "wall-seconds.txt"),
                  ("agent_exit", "agent.exit"),
                  ("hidden_exit", "hidden.exit"),
              ):
                  q = root / f"h1-{arm}-{suffix}"
                  if q.exists():
                      try:
                          entry[key] = int(q.read_text().strip())
                      except Exception:
                          entry[key] = q.read_text().strip()
              result[arm] = entry
          print(json.dumps(result, indent=2, sort_keys=True))
          PY
          cat "${{ runner.temp }}/h1-trace-summary.json"

      - name: Upload H1 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: premium-heldout-h1-redis-hiredis
          path: |
            ${{ runner.temp }}/copilot-version.txt
            ${{ runner.temp }}/h1-raw-output.jsonl
            ${{ runner.temp }}/h1-raw-otel.jsonl
            ${{ runner.temp }}/h1-raw.diff
            ${{ runner.temp }}/h1-raw.status
            ${{ runner.temp }}/h1-raw-agent.exit
            ${{ runner.temp }}/h1-raw-wall-seconds.txt
            ${{ runner.temp }}/h1-raw-hidden.txt
            ${{ runner.temp }}/h1-raw-hidden.exit
            ${{ runner.temp }}/h1-premium-output.jsonl
            ${{ runner.temp }}/h1-premium-otel.jsonl
            ${{ runner.temp }}/h1-premium.diff
            ${{ runner.temp }}/h1-premium.status
            ${{ runner.temp }}/h1-premium-agent.exit
            ${{ runner.temp }}/h1-premium-wall-seconds.txt
            ${{ runner.temp }}/h1-premium-hidden.txt
            ${{ runner.temp }}/h1-premium-hidden.exit
            ${{ runner.temp }}/h1-otl-output.jsonl
            ${{ runner.temp }}/h1-otl-otel.jsonl
            ${{ runner.temp }}/h1-otl.diff
            ${{ runner.temp }}/h1-otl.status
            ${{ runner.temp }}/h1-otl-agent.exit
            ${{ runner.temp }}/h1-otl-wall-seconds.txt
            ${{ runner.temp }}/h1-otl-hidden.txt
            ${{ runner.temp }}/h1-otl-hidden.exit
            ${{ runner.temp }}/h1-accepted-test.sha256
            ${{ runner.temp }}/h1-trace-summary.json
          if-no-files-found: warn
