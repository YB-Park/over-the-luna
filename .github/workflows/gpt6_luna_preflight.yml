name: GPT-6 Luna qualification preflight

on:
  push:
    branches:
      - research/gpt6-luna-model-qualification
    paths:
      - '.github/workflows/gpt6_luna_preflight.yml'
      - 'experiments/gpt6_luna/**'
      - 'agents/**'
      - 'plugin.json'
      - 'scripts/validate_plugin.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Check out experiment branch
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install validator dependency
        run: python -m pip install 'PyYAML==6.0.2'

      - name: Compile experiment harness
        run: python -m compileall -q scripts experiments/gpt6_luna

      - name: Validate stable plugin remains unchanged
        run: python scripts/validate_plugin.py

      - name: Verify model-only plugin variants
        run: |
          python experiments/gpt6_luna/build_variant.py \
            --source "$GITHUB_WORKSPACE" \
            --verify-pair \
            --control-output "$RUNNER_TEMP/plugin-gpt56" \
            --candidate-output "$RUNNER_TEMP/plugin-gpt60"

      - name: Self-test hidden fixtures
        run: python experiments/gpt6_luna/fixture.py selftest --case all

      - name: Check experiment is non-billing
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path(".github/workflows/gpt6_luna_preflight.yml").read_text(encoding="utf-8")
          forbidden = [
              "copilot-" + "requests: write",
              "npm install -g @github/" + "copilot",
              "\n          " + "copilot \\",
          ]
          hits = [item for item in forbidden if item in text]
          if hits:
              raise SystemExit(f"paid Copilot capability found in preflight: {hits}")
          print("Preflight contains no paid Copilot call.")
          PY
