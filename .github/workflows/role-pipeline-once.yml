name: P5 - actual role workflow versus SDK on release security fix
on:
  push:
    branches: [research/next-role-topology]
    paths: [docs/ONE_SHOT_ROLE_PIPELINE.md]
permissions:
  contents: read
  copilot-requests: write
jobs:
  role-workflow:
    if: contains(github.event.head_commit.message, '[run-role-pipeline-once]')
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Python fixture parser
        run: python -m pip install 'PyYAML==6.0.2'
      - name: Syntax checks without inference
        run: |
          node --check scripts/role_pipeline_pair.mjs
          python -m py_compile scripts/role_pipeline_grader.py
      - name: Install pinned Copilot runtime and SDK
        run: |
          npm install -g @github/copilot@1.0.88
          npm install --prefix scripts --no-save --no-package-lock @github/copilot-sdk@1.0.19
      - name: Bounded public code task; named Architect/Reviewer and actual diff required
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COPILOT_AUTO_UPDATE: 'false'
          ARTIFACT_DIR: ${{ runner.temp }}/otl-role-pipeline
        run: node scripts/role_pipeline_pair.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p5-role-pipeline-and-actual-public-patches
          path: ${{ runner.temp }}/otl-role-pipeline
          if-no-files-found: ignore
          retention-days: 30
