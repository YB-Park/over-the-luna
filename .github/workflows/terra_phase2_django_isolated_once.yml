name: Terra Phase 2 Django isolated E2E one-shot

on:
  push:
    branches:
      - experiment/terra-deep-judgment
    paths:
      - .github/workflows/terra_phase2_django_isolated_once.yml

permissions:
  contents: read
  copilot-requests: write

jobs:
  django-isolated:
    runs-on: ubuntu-latest
    steps:
      - name: Check out experiment harness
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install shared dependencies
        run: |
          npm install -g @github/copilot
          copilot --version | tee "${{ runner.temp }}/copilot-version.txt"
          python -m pip install 'asgiref>=3.7.0' 'sqlparse>=0.3.1'

      - name: Snapshot experiment plugin
        run: |
          mkdir -p "${{ runner.temp }}/otl-plugin"
          cp plugin.json "${{ runner.temp }}/otl-plugin/plugin.json"
          cp -R agents "${{ runner.temp }}/otl-plugin/agents"

      - name: Prepare isolated historical workspaces
        run: |
          for arm in baseline candidate; do
            dir="${{ runner.temp }}/django-$arm"
            mkdir -p "$dir"
            cd "$dir"
            git init -q
            git remote add origin https://github.com/django/django.git
            git fetch -q --depth=1 origin b3dc80682e678b20c89fb2a430c0bc77960a29ac
            git checkout -q --detach FETCH_HEAD
            test -z "$(git status --porcelain)"
            PYTHONPATH="$dir" python - <<'PY'
          import django, pathlib
          here = pathlib.Path.cwd().resolve()
          loaded = pathlib.Path(django.__file__).resolve()
          print("django_source=", loaded)
          assert str(loaded).startswith(str(here)), (loaded, here)
          PY
          done

      - name: Baseline implementation
        working-directory: ${{ runner.temp }}/django-baseline
        env:
          PYTHONPATH: ${{ runner.temp }}/django-baseline
          GITHUB_TOKEN: ${{ github.token }}
          COPILOT_OTEL_FILE_EXPORTER_PATH: ${{ runner.temp }}/iso-baseline-otel.jsonl
          COPILOT_OTEL_CAPTURE_CONTENT: 'false'
          TASK_PROMPT: >-
            HELD-OUT CROSS-CUTTING LIFECYCLE IMPLEMENTATION. Do not inspect git history or
            use external services. In this historical Django snapshot, ASGIHandler races
            request/view processing against an incoming http.disconnect and cancels the losing
            task. A disconnect can occur before a response exists or while a response is being
            sent. Cleanup may therefore be cancelled too: request/response resources may not
            be closed and request_finished may fail to fire, potentially leaking database or
            other request-scoped resources. Implement the smallest robust lifecycle fix.
            Requirements: request_finished/response cleanup must occur exactly once; async view
            processing should still be cancellable on disconnect; synchronous view work already
            running in its thread must not have request body/resources invalidated underneath it;
            normal and streaming responses must preserve existing send behavior; request creation
            errors must still close the error response. Add focused regression coverage for the
            consequential cancellation paths and run relevant ASGI tests. Do not consult later
            commits or PRs.
        run: |
          set -o pipefail
          copilot             --plugin-dir="${{ runner.temp }}/otl-plugin"             --agent='over-the-luna:over-the-luna'             --model=gpt-5.6-luna             --available-tools='view,glob,rg,apply_patch,bash,task,list_agents,read_agent'             --allow-all-tools             --max-ai-credits=60             --no-remote-export             --output-format=json             --prompt="$TASK_PROMPT"             | tee "${{ runner.temp }}/iso-baseline-output.jsonl"
          git diff --no-ext-diff > "${{ runner.temp }}/iso-baseline.diff"
          git status --short > "${{ runner.temp }}/iso-baseline.status"

      - name: Candidate Deep Judgment
        working-directory: ${{ runner.temp }}/django-candidate
        env:
          PYTHONPATH: ${{ runner.temp }}/django-candidate
          GITHUB_TOKEN: ${{ github.token }}
          COPILOT_OTEL_FILE_EXPORTER_PATH: ${{ runner.temp }}/iso-judgment-otel.jsonl
          COPILOT_OTEL_CAPTURE_CONTENT: 'false'
          JUDGMENT_PROMPT: >-
            HELD-OUT CROSS-CUTTING LIFECYCLE JUDGMENT. READ-ONLY. Do not edit files, run shell
            commands, inspect git history, or use external services. In this historical Django
            snapshot, ASGIHandler races request/view processing against an incoming
            http.disconnect and cancels the losing task. A disconnect can occur before a
            response exists or while a response is being sent. Cleanup may therefore be
            cancelled too: request/response resources may not be closed and request_finished
            may fail to fire, potentially leaking database or other request-scoped resources.
            Determine the smallest robust execution contract. It must preserve cancellation of
            async view processing, avoid invalidating resources underneath synchronous view work
            already running in a thread, ensure response/request cleanup and request_finished
            occur exactly once on all relevant paths, preserve normal/streaming send semantics,
            and handle request-creation errors correctly. Do not assume any later patch exists.
            Follow Deep Judgment's required output contract.
        run: |
          set -o pipefail
          copilot             --plugin-dir="${{ runner.temp }}/otl-plugin"             --agent='over-the-luna:deep-judgment'             --model=gpt-5.6-terra             --available-tools='view,glob,rg,task,list_agents,read_agent'             --allow-all-tools             --max-ai-credits=40             --no-remote-export             --output-format=json             --prompt="$JUDGMENT_PROMPT"             | tee "${{ runner.temp }}/iso-judgment-output.jsonl"
          test -z "$(git status --porcelain)"
          python - <<'PY'
          import json, os, pathlib
          root=pathlib.Path(os.environ["RUNNER_TEMP"])
          msgs=[]
          for line in (root/"iso-judgment-output.jsonl").read_text().splitlines():
              try:e=json.loads(line)
              except Exception:continue
              if e.get("type")=="assistant.message":
                  c=(e.get("data") or {}).get("content")
                  if c:msgs.append(c)
          (root/"iso-judgment-final.txt").write_text(msgs[-1] if msgs else "")
          PY

      - name: Candidate implementation with judgment contract
        working-directory: ${{ runner.temp }}/django-candidate
        env:
          PYTHONPATH: ${{ runner.temp }}/django-candidate
          GITHUB_TOKEN: ${{ github.token }}
          COPILOT_OTEL_FILE_EXPORTER_PATH: ${{ runner.temp }}/iso-candidate-otel.jsonl
          COPILOT_OTEL_CAPTURE_CONTENT: 'false'
        run: |
          cat > "${{ runner.temp }}/iso-candidate-prompt.txt" <<'EOF'
          HELD-OUT CROSS-CUTTING LIFECYCLE IMPLEMENTATION. Do not inspect git history or use
          external services. Fix the ASGI disconnect/cancellation lifecycle bug described below.

          Symptom and constraints:
          ASGIHandler races request/view processing against http.disconnect. Cancellation can
          occur before a response exists or while it is being sent, and cleanup/request_finished
          can be lost. Preserve async-view cancellation, synchronous-view safety, normal and
          streaming response semantics, exactly-once cleanup/signal behavior, and request-error
          cleanup.

          A human-selected Deep Judgment checkpoint produced this pre-change decision contract.
          Treat it as evidence and constraints, not as authority over repository facts. Re-open
          only if current code contradicts it:

          ----- BEGIN DEEP JUDGMENT -----
          EOF
          cat "${{ runner.temp }}/iso-judgment-final.txt" >> "${{ runner.temp }}/iso-candidate-prompt.txt"
          cat >> "${{ runner.temp }}/iso-candidate-prompt.txt" <<'EOF'
          ----- END DEEP JUDGMENT -----

          Implement the smallest coherent fix. Main remains the sole mutation owner.
          EOF
          set -o pipefail
          copilot             --plugin-dir="${{ runner.temp }}/otl-plugin"             --agent='over-the-luna:over-the-luna'             --model=gpt-5.6-luna             --available-tools='view,glob,rg,apply_patch,bash,task,list_agents,read_agent'             --allow-all-tools             --max-ai-credits=60             --no-remote-export             --output-format=json             --prompt="$(cat "${{ runner.temp }}/iso-candidate-prompt.txt")"             | tee "${{ runner.temp }}/iso-candidate-output.jsonl"
          git diff --no-ext-diff > "${{ runner.temp }}/iso-candidate.diff"
          git status --short > "${{ runner.temp }}/iso-candidate.status"

      - name: Inject hidden accepted ASGI tests after implementation
        run: |
          for arm in baseline candidate; do
            curl -fsSL               https://raw.githubusercontent.com/django/django/11393ab1316f973c5fbb534305750740d909b4e4/tests/asgi/tests.py               -o "${{ runner.temp }}/django-$arm/tests/asgi/tests.py"
          done

      - name: Baseline hidden-oracle validation
        if: always()
        working-directory: ${{ runner.temp }}/django-baseline
        env:
          PYTHONPATH: ${{ runner.temp }}/django-baseline
        run: |
          set +e
          python - <<'PY' > "${{ runner.temp }}/iso-baseline-import.txt"
          import django, pathlib
          print(pathlib.Path(django.__file__).resolve())
          print(pathlib.Path.cwd().resolve())
          PY
          python tests/runtests.py asgi --verbosity 1 > "${{ runner.temp }}/iso-baseline-hidden-tests.txt" 2>&1
          code=$?
          echo "$code" > "${{ runner.temp }}/iso-baseline-hidden-tests.exit"
          cat "${{ runner.temp }}/iso-baseline-hidden-tests.txt"
          exit 0

      - name: Candidate hidden-oracle validation
        if: always()
        working-directory: ${{ runner.temp }}/django-candidate
        env:
          PYTHONPATH: ${{ runner.temp }}/django-candidate
        run: |
          set +e
          python - <<'PY' > "${{ runner.temp }}/iso-candidate-import.txt"
          import django, pathlib
          print(pathlib.Path(django.__file__).resolve())
          print(pathlib.Path.cwd().resolve())
          PY
          python tests/runtests.py asgi --verbosity 1 > "${{ runner.temp }}/iso-candidate-hidden-tests.txt" 2>&1
          code=$?
          echo "$code" > "${{ runner.temp }}/iso-candidate-hidden-tests.exit"
          cat "${{ runner.temp }}/iso-candidate-hidden-tests.txt"
          exit 0

      - name: Upload isolated Django artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terra-phase2-django-isolated
          path: |
            ${{ runner.temp }}/copilot-version.txt
            ${{ runner.temp }}/iso-baseline-output.jsonl
            ${{ runner.temp }}/iso-baseline-otel.jsonl
            ${{ runner.temp }}/iso-baseline.diff
            ${{ runner.temp }}/iso-baseline.status
            ${{ runner.temp }}/iso-baseline-import.txt
            ${{ runner.temp }}/iso-baseline-hidden-tests.txt
            ${{ runner.temp }}/iso-baseline-hidden-tests.exit
            ${{ runner.temp }}/iso-judgment-output.jsonl
            ${{ runner.temp }}/iso-judgment-otel.jsonl
            ${{ runner.temp }}/iso-judgment-final.txt
            ${{ runner.temp }}/iso-candidate-prompt.txt
            ${{ runner.temp }}/iso-candidate-output.jsonl
            ${{ runner.temp }}/iso-candidate-otel.jsonl
            ${{ runner.temp }}/iso-candidate.diff
            ${{ runner.temp }}/iso-candidate.status
            ${{ runner.temp }}/iso-candidate-import.txt
            ${{ runner.temp }}/iso-candidate-hidden-tests.txt
            ${{ runner.temp }}/iso-candidate-hidden-tests.exit
          if-no-files-found: warn
