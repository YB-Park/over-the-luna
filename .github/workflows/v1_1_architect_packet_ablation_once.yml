name: v1.1 one-shot Architect packet ablation

# ONE-SHOT PAID RESEARCH WORKFLOW. Delete after artifact collection.
on:
  pull_request:
    paths:
      - '.github/workflows/v1_1_architect_packet_ablation_once.yml'
  workflow_dispatch:

permissions:
  contents: read
  copilot-requests: write

jobs:
  architect-packet:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        policy: [packet, bounded]
        repeat: [1, 2]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install Copilot CLI
        run: |
          npm install -g @github/copilot
          copilot --version

      - name: Prepare fixed fixture and Architect candidate
        env:
          POLICY: ${{ matrix.policy }}
          FIXTURE_SHA: fcf0c568ba5bf41f69f6c9594359842c473d8946
        run: |
          set -euo pipefail
          git worktree add --detach "${RUNNER_TEMP}/fixture" "$FIXTURE_SHA"
          cp -a "$GITHUB_WORKSPACE" "${RUNNER_TEMP}/plugin"
          case "$POLICY" in
            packet)
              cp "$GITHUB_WORKSPACE/experiments/v1_1_candidate_architect_packet.agent.md" \
                 "${RUNNER_TEMP}/plugin/agents/luna-architect.agent.md"
              ;;
            bounded)
              cp "$GITHUB_WORKSPACE/experiments/v1_1_candidate_architect_bounded_packet.agent.md" \
                 "${RUNNER_TEMP}/plugin/agents/luna-architect.agent.md"
              ;;
            *) exit 2 ;;
          esac

      - name: Run direct read-only mutation-planning pass
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COPILOT_OTEL_FILE_EXPORTER_PATH: ${{ runner.temp }}/otel.jsonl
          COPILOT_OTEL_CAPTURE_CONTENT: 'false'
          TASK_PROMPT: >-
            READ-ONLY MUTATION PLANNING ABLATION. Do not modify files or run shell commands. A Main
            implementation agent will later integrate standalone tool-ownership analysis into
            scripts/analyze_otel.py. Determine the minimum repository evidence Main needs to do that
            safely while preserving existing consumers. Required behavior: preserve top-level global
            `tools` counts; add JSON `tool_ownership` with `main`, `council`, and `by_agent`; nearest
            invoking-agent attribution; orphan tools count as Main; add Markdown `## Tool ownership`;
            make scripts/analyze_tool_ownership.py reuse the shared implementation while preserving
            its legacy `main`, `leaf`, and `by_agent` JSON contract; add focused nested-leaf and
            orphan/Main regressions. Identify concrete mutation targets, contract-critical consumers,
            relationships, and genuinely unresolved facts. Follow your installed Architect handback
            contract. The goal is decision-complete evidence for Main, not an implementation patch.
        run: |
          set -o pipefail
          cd "${RUNNER_TEMP}/fixture"
          copilot \
            --plugin-dir="${RUNNER_TEMP}/plugin" \
            --agent='over-the-luna:luna-architect' \
            --model=gpt-5.6-luna \
            --available-tools='view,glob,rg' \
            --allow-all-tools \
            --max-ai-credits=30 \
            --no-remote-export \
            --output-format=json \
            --prompt="$TASK_PROMPT" \
            | tee "${RUNNER_TEMP}/output.jsonl"

      - name: Check decision completeness
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(os.environ['RUNNER_TEMP']) / 'output.jsonl'
          chunks = []
          if path.exists():
              for line in path.read_text(encoding='utf-8').splitlines():
                  try:
                      event = json.loads(line)
                  except json.JSONDecodeError:
                      continue
                  if not isinstance(event, dict):
                      continue
                  kind = event.get('type')
                  data = event.get('data')
                  if not isinstance(data, dict):
                      continue
                  value = data.get('content') if kind == 'assistant.message' else data.get('deltaContent') if kind == 'assistant.message_delta' else None
                  if isinstance(value, str):
                      chunks.append(value)
          text = ''.join(chunks)
          required = [
              'scripts/analyze_otel.py',
              'scripts/analyze_tool_ownership.py',
              'tests/test_analyze_otel.py',
              'tool_ownership',
              'main',
              'council',
              'by_agent',
              'leaf',
              'orphan',
              '## MUTATION_TARGETS',
              '## UNRESOLVED',
          ]
          missing = [item for item in required if item not in text]
          out = Path(os.environ['RUNNER_TEMP']) / 'packet-check.txt'
          out.write_text('PASS\n' if not missing else 'MISSING: ' + ', '.join(missing) + '\n', encoding='utf-8')
          raise SystemExit(0 if not missing else 1)
          PY

      - name: Summarize direct trace
        if: always()
        run: |
          if [ -f "${RUNNER_TEMP}/otel.jsonl" ]; then
            python "$GITHUB_WORKSPACE/scripts/analyze_otel.py" \
              "${RUNNER_TEMP}/otel.jsonl" --events "${RUNNER_TEMP}/output.jsonl" \
              > "${RUNNER_TEMP}/summary.md"
            python "$GITHUB_WORKSPACE/scripts/analyze_tool_ownership.py" \
              "${RUNNER_TEMP}/otel.jsonl" > "${RUNNER_TEMP}/tool-ownership.json"
          fi
          git -C "${RUNNER_TEMP}/fixture" status --porcelain > "${RUNNER_TEMP}/fixture-status.txt"

      - name: Upload Architect artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: architect-${{ matrix.policy }}-${{ matrix.repeat }}
          path: |
            ${{ runner.temp }}/output.jsonl
            ${{ runner.temp }}/otel.jsonl
            ${{ runner.temp }}/summary.md
            ${{ runner.temp }}/tool-ownership.json
            ${{ runner.temp }}/packet-check.txt
            ${{ runner.temp }}/fixture-status.txt
          if-no-files-found: warn
