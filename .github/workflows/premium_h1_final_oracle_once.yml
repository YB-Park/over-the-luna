name: Premium H1 final behavior oracle

on:
  push:
    branches:
      - experiment/premium-luna-orchestration
    paths:
      - .github/workflows/premium_h1_final_oracle_once.yml

permissions:
  contents: read
  actions: read

jobs:
  final-oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Download exact frozen H1 arm diffs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "${{ runner.temp }}/h1-artifact"
          gh run download 34325241072 \
            --repo YB-Park/over-the-luna \
            --name premium-heldout-h1-redis-hiredis \
            --dir "${{ runner.temp }}/h1-artifact"
          sha256sum "${{ runner.temp }}/h1-artifact/"*.diff \
            | tee "${{ runner.temp }}/h1-final-diff-sha256.txt"

      - name: Reconstruct frozen arms and accepted head
        run: |
          base="${{ runner.temp }}/h1-base"
          mkdir -p "$base"
          cd "$base"
          git init -q
          git remote add origin https://github.com/redis/redis-py.git
          git fetch -q --depth=1 origin b121809bd7c7107eedb6b9849180c83246419961
          git checkout -q --detach FETCH_HEAD

          python -m pip install -q pytest pytest-asyncio pytest-timeout 'hiredis>=3.2.0'

          cd "${{ runner.temp }}"
          for arm in raw premium otl; do
            cp -a h1-base "h1-$arm"
            git -C "h1-$arm" apply "${{ runner.temp }}/h1-artifact/h1-$arm.diff"
          done

          accepted="${{ runner.temp }}/h1-accepted"
          mkdir -p "$accepted"
          cd "$accepted"
          git init -q
          git remote add origin https://github.com/redis/redis-py.git
          git fetch -q --depth=1 origin 55d41593d3795080cdfc090ed56c19d9ab4ea3b1
          git checkout -q --detach FETCH_HEAD

      - name: Write implementation-independent final oracle
        run: |
          for arm in raw premium otl accepted; do
            cat > "${{ runner.temp }}/h1-$arm/tests/test_h1_final_oracle.py" <<'PY'
          import socket
          import time
          from unittest import mock

          import pytest

          from redis._parsers.hiredis import _HiredisParser
          from redis.exceptions import ConnectionError


          class _Encoder:
              encoding_errors = "strict"
              decode_responses = False
              encoding = "utf-8"


          class _Connection:
              def __init__(self, sock):
                  self._sock = sock
                  self.socket_timeout = None
                  self.encoder = _Encoder()


          def _parser(sock):
              parser = _HiredisParser(socket_read_size=65536)
              parser.on_connect(_Connection(sock))
              return parser


          def _wait_readable():
              time.sleep(0.05)


          def test_peer_close_without_pending_data_is_not_reusable():
              client, server = socket.socketpair()
              parser = _parser(client)
              try:
                  server.close()
                  _wait_readable()
                  with pytest.raises(ConnectionError, match="Connection closed by server"):
                      parser.can_read(timeout=0)
              finally:
                  parser.on_disconnect()
                  client.close()


          def test_pending_resp3_push_survives_until_processed_before_close():
              listener = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
              listener.bind(("127.0.0.1", 0))
              listener.listen(1)
              client = socket.create_connection(listener.getsockname())
              server, _ = listener.accept()
              parser = _parser(client)
              try:
                  payload = (
                      b">3\r\n"
                      b"$7\r\nmessage\r\n"
                      b"$2\r\nch\r\n"
                      b"$5\r\nhello\r\n"
                  )
                  server.sendall(payload)
                  server.close()
                  _wait_readable()

                  assert parser.can_read(timeout=0) is True
                  assert parser.read_response(push_request=True) == [
                      b"message", b"ch", b"hello"
                  ]
                  with pytest.raises(ConnectionError, match="Connection closed by server"):
                      parser.can_read(timeout=0)
              finally:
                  parser.on_disconnect()
                  client.close()
                  listener.close()


          def test_open_readable_push_remains_available():
              client, server = socket.socketpair()
              parser = _parser(client)
              try:
                  server.sendall(
                      b">3\r\n"
                      b"$7\r\nmessage\r\n"
                      b"$2\r\nch\r\n"
                      b"$4\r\nlive\r\n"
                  )
                  assert parser.can_read(timeout=0) is True
                  assert parser.read_response(push_request=True) == [
                      b"message", b"ch", b"live"
                  ]
              finally:
                  parser.on_disconnect()
                  client.close()
                  server.close()


          def test_ssl_like_recv_flags_fallback_still_detects_real_eof(monkeypatch):
              # Real kernel readiness/EOF, but recv(flags) behaves like SSLSocket.
              class SSLishWrapper:
                  def __init__(self, sock):
                      self._sock = sock
                      self.timeout = None

                  def fileno(self):
                      return self._sock.fileno()

                  def pending(self):
                      return 0

                  def recv(self, size, flags=0):
                      if flags:
                          raise ValueError("non-zero flags not allowed")
                      return self._sock.recv(size)

                  def recv_into(self, buffer):
                      return self._sock.recv_into(buffer)

                  def settimeout(self, value):
                      self.timeout = value
                      self._sock.settimeout(value)

              client, server = socket.socketpair()
              wrapped = SSLishWrapper(client)
              parser = _HiredisParser.__new__(_HiredisParser)
              parser._reader = mock.Mock()
              parser._reader.has_data.return_value = False
              parser._sock = wrapped
              parser._buffer = bytearray(65536)
              parser._socket_timeout = None
              try:
                  server.close()
                  _wait_readable()
                  with pytest.raises(ConnectionError, match="Connection closed by server"):
                      parser.can_read(timeout=0)
              finally:
                  client.close()
          PY
          done

      - name: Run same final oracle on all frozen arms and accepted head
        run: |
          set +e
          overall=0
          for arm in raw premium otl accepted; do
            (
              cd "${{ runner.temp }}/h1-$arm"
              PYTHONPATH=. python -m pytest -q tests/test_h1_final_oracle.py
            ) > "${{ runner.temp }}/h1-$arm-final.txt" 2>&1
            code=$?
            echo "$code" > "${{ runner.temp }}/h1-$arm-final.exit"
            echo "===== $arm final oracle exit=$code ====="
            cat "${{ runner.temp }}/h1-$arm-final.txt"
            if [ "$arm" = "accepted" ] && [ "$code" -ne 0 ]; then
              overall=1
            fi
          done
          exit "$overall"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: premium-heldout-h1-final-oracle
          path: |
            ${{ runner.temp }}/h1-final-diff-sha256.txt
            ${{ runner.temp }}/h1-raw-final.txt
            ${{ runner.temp }}/h1-raw-final.exit
            ${{ runner.temp }}/h1-premium-final.txt
            ${{ runner.temp }}/h1-premium-final.exit
            ${{ runner.temp }}/h1-otl-final.txt
            ${{ runner.temp }}/h1-otl-final.exit
            ${{ runner.temp }}/h1-accepted-final.txt
            ${{ runner.temp }}/h1-accepted-final.exit
