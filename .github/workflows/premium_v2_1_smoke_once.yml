name: Premium v2.1 one-shot runtime smoke

on:
  push:
    branches:
      - experiment/premium-v2-1-minimal-cascade
    paths:
      - .github/workflows/premium_v2_1_smoke_once.yml

permissions:
  contents: read
  copilot-requests: write

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact experiment commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install Copilot CLI
        run: |
          npm install -g @github/copilot
          copilot --version | tee "${{ runner.temp }}/copilot-version.txt"

      - name: Prepare isolated synthetic workspace
        run: |
          workspace="${{ runner.temp }}/v2-1-smoke-workspace"
          mkdir -p "$workspace"
          cd "$workspace"
          git init -q
          cat > counter.py <<'PY'
          def increment(value: int) -> int:
              """Return value incremented by one."""
              return value - 1
          PY
          cat > test_counter.py <<'PY'
          import unittest
          from counter import increment

          class CounterTests(unittest.TestCase):
              def test_increment(self):
                  self.assertEqual(increment(4), 5)
                  self.assertEqual(increment(-1), 0)

          if __name__ == "__main__":
              unittest.main()
          PY
          git add counter.py test_counter.py
          git -c user.name=smoke -c user.email=smoke@example.invalid commit -qm base
          git remote remove origin 2>/dev/null || true
          test -z "$(git status --porcelain)"

      - name: Run Premium v2.1 audit-mode smoke
        working-directory: ${{ runner.temp }}/v2-1-smoke-workspace
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OTL_V2_1_STATE_DIR: ${{ runner.temp }}/otl-v2-1-state
          COPILOT_OTEL_FILE_EXPORTER_PATH: ${{ runner.temp }}/v2-1-smoke-otel.jsonl
          COPILOT_OTEL_CAPTURE_CONTENT: 'false'
          TASK_PROMPT: >-
            RUNTIME SMOKE ONLY. Work only in this tiny local repository. Do not inspect git
            history, branches, remotes, pull requests, or external services. The public function
            increment(value) is documented to return value plus one, but the implementation is
            wrong and the included unittest fails. Make the smallest correct fix, preserve the
            function signature, run the focused local test, and stop. Follow the Premium v2.1
            controller metadata contract exactly. Do not add unrelated files or features.
        run: |
          set +e
          set -o pipefail
          start=$(date +%s)
          copilot \
            --plugin-dir="${{ github.workspace }}/experiments/premium_v2_1_plugin" \
            --agent='over-the-luna-premium-v2-1-experiment:premium-cascade-v2-1' \
            --model=gpt-5.6-terra \
            --available-tools='view,glob,rg,apply_patch,bash,task,list_agents,read_agent' \
            --allow-all-tools \
            --no-ask-user \
            --max-ai-credits=30 \
            --no-remote-export \
            --output-format=json \
            --prompt="$TASK_PROMPT" \
            | tee "${{ runner.temp }}/v2-1-smoke-output.jsonl"
          code=${PIPESTATUS[0]}
          end=$(date +%s)
          echo "$code" > "${{ runner.temp }}/v2-1-smoke-agent.exit"
          echo "$((end-start))" > "${{ runner.temp }}/v2-1-smoke-wall-seconds.txt"
          git diff --no-ext-diff > "${{ runner.temp }}/v2-1-smoke.diff"
          git status --short > "${{ runner.temp }}/v2-1-smoke.status"
          python -m unittest -v > "${{ runner.temp }}/v2-1-smoke-tests.txt" 2>&1
          echo "$?" > "${{ runner.temp }}/v2-1-smoke-tests.exit"
          exit 0

      - name: Summarize smoke trace
        if: always()
        env:
          OTL_V2_1_STATE_DIR: ${{ runner.temp }}/otl-v2-1-state
        run: |
          python - <<'PY' > "${{ runner.temp }}/v2-1-smoke-summary.json"
          import json
          from pathlib import Path
          root = Path(r"${{ runner.temp }}")
          p = root / "v2-1-smoke-output.jsonl"
          out = {"usage_credits": None, "models": [], "subagents": [], "tool_starts": 0,
                 "agent_exit": None, "test_exit": None, "wall_seconds": None}
          if p.exists():
              for line in p.read_text(errors="replace").splitlines():
                  try:
                      e = json.loads(line)
                  except Exception:
                      continue
                  typ = e.get("type")
                  data = e.get("data") or {}
                  if typ == "session.usage_checkpoint":
                      nai = data.get("totalNanoAiu")
                      if isinstance(nai, (int, float)):
                          out["usage_credits"] = nai / 1_000_000_000
                  elif typ == "model.call_start":
                      m = data.get("model")
                      if m and m not in out["models"]:
                          out["models"].append(m)
                  elif typ == "subagent.completed":
                      out["subagents"].append({
                          "agent": data.get("agentDisplayName") or data.get("agentName"),
                          "model": data.get("model"),
                          "tool_calls": data.get("totalToolCalls"),
                          "tokens": data.get("totalTokens"),
                          "duration_ms": data.get("durationMs"),
                      })
                  elif typ == "tool.execution_start":
                      out["tool_starts"] += 1
          for key, name in (("agent_exit", "v2-1-smoke-agent.exit"),
                            ("test_exit", "v2-1-smoke-tests.exit"),
                            ("wall_seconds", "v2-1-smoke-wall-seconds.txt")):
              q = root / name
              if q.exists():
                  try:
                      out[key] = int(q.read_text().strip())
                  except Exception:
                      out[key] = q.read_text().strip()
          print(json.dumps(out, indent=2, sort_keys=True))
          PY
          cat "${{ runner.temp }}/v2-1-smoke-summary.json"
          echo "===== hook state files ====="
          find "${{ runner.temp }}/otl-v2-1-state" -maxdepth 1 -type f -print 2>/dev/null || true
          echo "===== workspace metadata ====="
          find "${{ runner.temp }}/v2-1-smoke-workspace/.otl-v2-1" -maxdepth 1 -type f -print 2>/dev/null || true

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: premium-v2-1-runtime-smoke
          path: |
            ${{ runner.temp }}/copilot-version.txt
            ${{ runner.temp }}/v2-1-smoke-output.jsonl
            ${{ runner.temp }}/v2-1-smoke-otel.jsonl
            ${{ runner.temp }}/v2-1-smoke.diff
            ${{ runner.temp }}/v2-1-smoke.status
            ${{ runner.temp }}/v2-1-smoke-agent.exit
            ${{ runner.temp }}/v2-1-smoke-wall-seconds.txt
            ${{ runner.temp }}/v2-1-smoke-tests.txt
            ${{ runner.temp }}/v2-1-smoke-tests.exit
            ${{ runner.temp }}/v2-1-smoke-summary.json
            ${{ runner.temp }}/otl-v2-1-state/
            ${{ runner.temp }}/v2-1-smoke-workspace/.otl-v2-1/
          if-no-files-found: warn
