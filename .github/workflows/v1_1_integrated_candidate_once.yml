name: v1.1 one-shot integrated candidate replication

# ONE-SHOT PAID RESEARCH WORKFLOW. Delete after artifact collection.
on:
  pull_request:
    paths:
      - '.github/workflows/v1_1_integrated_candidate_once.yml'
  workflow_dispatch:

permissions:
  contents: read
  copilot-requests: write

jobs:
  integrated-candidate:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        repeat: [1, 2]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          python -m pip install 'PyYAML==6.0.2'
          npm install -g @github/copilot
          copilot --version

      - name: Prepare fixed fixture and integrated candidate plugin
        env:
          FIXTURE_SHA: fcf0c568ba5bf41f69f6c9594359842c473d8946
        run: |
          set -euo pipefail
          git worktree add --detach "${RUNNER_TEMP}/fixture" "$FIXTURE_SHA"
          cp -a "$GITHUB_WORKSPACE" "${RUNNER_TEMP}/plugin"
          cp "$GITHUB_WORKSPACE/experiments/v1_1_candidate_integrated.agent.md" \
             "${RUNNER_TEMP}/plugin/agents/over-the-luna.agent.md"
          cp "$GITHUB_WORKSPACE/experiments/v1_1_candidate_architect_packet.agent.md" \
             "${RUNNER_TEMP}/plugin/agents/luna-architect.agent.md"
          cp "$GITHUB_WORKSPACE/experiments/v1_1_candidate_invariant_reviewer.agent.md" \
             "${RUNNER_TEMP}/plugin/agents/luna-reviewer.agent.md"

      - name: Run controlled integrated mutation trajectory
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COPILOT_OTEL_FILE_EXPORTER_PATH: ${{ runner.temp }}/otel.jsonl
          COPILOT_OTEL_CAPTURE_CONTENT: 'false'
          TASK_PROMPT: >-
            V1.1 INTEGRATED CANDIDATE PROBE. Integrate the standalone tool-ownership analysis into
            the main OTel analyzer without breaking existing consumers. Understand how ownership
            attribution is currently split across scripts/analyze_otel.py,
            scripts/analyze_tool_ownership.py, tests, and workflow/experiment consumers before
            editing. Preserve the existing top-level global `tools` counts. Add a new top-level JSON
            object named `tool_ownership` with `main`, `council`, and `by_agent` maps, all attributed
            to the nearest invoking agent. Orphan tool spans must count as Main. Add a Markdown
            `## Tool ownership` section. Make scripts/analyze_tool_ownership.py reuse the same
            ownership implementation while preserving its existing `main`, `leaf`, and `by_agent`
            JSON contract. Add focused regression tests for nested leaf attribution and orphan/Main
            attribution. Run the relevant tests and full test suite. Main remains the only mutation
            owner. Follow the installed Over the Luna investigation and assurance policy naturally.
            Do not add Council calls merely because this is an experiment and do not use premium review.
        run: |
          set -o pipefail
          cd "${RUNNER_TEMP}/fixture"
          copilot \
            --plugin-dir="${RUNNER_TEMP}/plugin" \
            --agent='over-the-luna:over-the-luna' \
            --model=gpt-5.6-luna \
            --available-tools='view,glob,rg,apply_patch,bash,task,list_agents,read_agent' \
            --allow-all-tools \
            --max-ai-credits=30 \
            --no-remote-export \
            --output-format=json \
            --prompt="$TASK_PROMPT" \
            | tee "${RUNNER_TEMP}/output.jsonl"

      - name: Capture final candidate patch
        if: always()
        run: |
          git -C "${RUNNER_TEMP}/fixture" diff --no-ext-diff > "${RUNNER_TEMP}/candidate.diff"
          git -C "${RUNNER_TEMP}/fixture" status --short > "${RUNNER_TEMP}/fixture-status.txt"

      - name: Run normalized visible validation
        if: always()
        run: |
          set +e
          cd "${RUNNER_TEMP}/fixture"
          python -m unittest discover -s tests -v > "${RUNNER_TEMP}/visible-tests.txt" 2>&1
          echo "$?" > "${RUNNER_TEMP}/visible-tests.exit"
          python scripts/validate_plugin.py > "${RUNNER_TEMP}/plugin-validation.txt" 2>&1
          echo "$?" > "${RUNNER_TEMP}/plugin-validation.exit"
          cat "${RUNNER_TEMP}/visible-tests.txt"
          cat "${RUNNER_TEMP}/plugin-validation.txt"
          exit 0

      - name: Run hidden final ownership contract
        if: always()
        run: |
          set +e
          cd "${RUNNER_TEMP}/fixture"
          cat > "${RUNNER_TEMP}/hidden_contract.py" <<'PY'
          import json
          import subprocess
          import sys
          import tempfile
          from pathlib import Path

          def span(name, operation, span_id, *, trace_id, parent=None, attrs=None):
              attributes = {"gen_ai.operation.name": operation}
              attributes.update(attrs or {})
              value = {
                  "name": name,
                  "attributes": attributes,
                  "spanContext": {"traceId": trace_id, "spanId": span_id},
              }
              if parent:
                  value["parentSpanContext"] = {"traceId": trace_id, "spanId": parent}
              return value

          # Basic ownership + orphan contract.
          events = [
              span("invoke_agent over-the-luna:over-the-luna", "invoke_agent", "root", trace_id="trace-basic", attrs={"gen_ai.agent.name": "over-the-luna:over-the-luna"}),
              span("execute_tool view", "execute_tool", "main-view", trace_id="trace-basic", parent="root", attrs={"gen_ai.tool.name": "view"}),
              span("execute_tool task", "execute_tool", "delegate", trace_id="trace-basic", parent="root", attrs={"gen_ai.tool.name": "task"}),
              span("invoke_agent over-the-luna:luna-architect", "invoke_agent", "architect", trace_id="trace-basic", parent="delegate", attrs={"gen_ai.agent.name": "over-the-luna:luna-architect"}),
              span("execute_tool rg", "execute_tool", "leaf-rg", trace_id="trace-basic", parent="architect", attrs={"gen_ai.tool.name": "rg"}),
              span("execute_tool apply_patch", "execute_tool", "main-edit", trace_id="trace-basic", parent="root", attrs={"gen_ai.tool.name": "apply_patch"}),
              span("execute_tool glob", "execute_tool", "orphan", trace_id="trace-basic", attrs={"gen_ai.tool.name": "glob"}),
          ]
          with tempfile.TemporaryDirectory() as td:
              trace = Path(td) / "basic.jsonl"
              trace.write_text("\n".join(json.dumps(e) for e in events), encoding="utf-8")
              summary = json.loads(subprocess.check_output([sys.executable, "scripts/analyze_otel.py", str(trace), "--json"], text=True))
              assert summary["tools"] == {"view": 1, "task": 1, "rg": 1, "apply_patch": 1, "glob": 1}, summary["tools"]
              ownership = summary["tool_ownership"]
              assert ownership["main"] == {"view": 1, "task": 1, "apply_patch": 1, "glob": 1}, ownership
              assert ownership["council"] == {"rg": 1}, ownership
              standalone = json.loads(subprocess.check_output([sys.executable, "scripts/analyze_tool_ownership.py", str(trace)], text=True))
              assert standalone["main"] == ownership["main"]
              assert standalone["leaf"] == ownership["council"]
              assert standalone["by_agent"] == ownership["by_agent"]
              markdown = subprocess.check_output([sys.executable, "scripts/analyze_otel.py", str(trace)], text=True)
              assert "## Tool ownership" in markdown

          # Cross-trace identity contract: span IDs are trace-local, not global.
          collision = [
              span("invoke_agent Luna Architect", "invoke_agent", "shared", trace_id="trace-a", attrs={"gen_ai.agent.name": "Luna Architect"}),
              span("execute_tool view", "execute_tool", "tool-a", trace_id="trace-a", parent="shared", attrs={"gen_ai.tool.name": "view"}),
              span("invoke_agent over-the-luna:over-the-luna", "invoke_agent", "shared", trace_id="trace-b", attrs={"gen_ai.agent.name": "over-the-luna:over-the-luna"}),
          ]
          with tempfile.TemporaryDirectory() as td:
              trace = Path(td) / "collision.jsonl"
              trace.write_text("\n".join(json.dumps(e) for e in collision), encoding="utf-8")
              summary = json.loads(subprocess.check_output([sys.executable, "scripts/analyze_otel.py", str(trace), "--json"], text=True))
              assert summary["tool_ownership"]["council"] == {"view": 1}, summary["tool_ownership"]

          print("hidden integrated ownership contract passed")
          PY
          python "${RUNNER_TEMP}/hidden_contract.py" > "${RUNNER_TEMP}/hidden-tests.txt" 2>&1
          echo "$?" > "${RUNNER_TEMP}/hidden-tests.exit"
          cat "${RUNNER_TEMP}/hidden-tests.txt"
          exit 0

      - name: Summarize integrated policy trace with trusted analyzers
        if: always()
        run: |
          if [ -f "${RUNNER_TEMP}/otel.jsonl" ]; then
            python "$GITHUB_WORKSPACE/scripts/analyze_otel.py" \
              "${RUNNER_TEMP}/otel.jsonl" --events "${RUNNER_TEMP}/output.jsonl" \
              > "${RUNNER_TEMP}/policy-summary.md"
            python "$GITHUB_WORKSPACE/scripts/analyze_tool_ownership.py" \
              "${RUNNER_TEMP}/otel.jsonl" > "${RUNNER_TEMP}/policy-tool-ownership.json"
          fi

      - name: Upload integrated candidate artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-candidate-${{ matrix.repeat }}
          path: |
            ${{ runner.temp }}/output.jsonl
            ${{ runner.temp }}/otel.jsonl
            ${{ runner.temp }}/policy-summary.md
            ${{ runner.temp }}/policy-tool-ownership.json
            ${{ runner.temp }}/candidate.diff
            ${{ runner.temp }}/fixture-status.txt
            ${{ runner.temp }}/visible-tests.txt
            ${{ runner.temp }}/visible-tests.exit
            ${{ runner.temp }}/plugin-validation.txt
            ${{ runner.temp }}/plugin-validation.exit
            ${{ runner.temp }}/hidden-tests.txt
            ${{ runner.temp }}/hidden-tests.exit
          if-no-files-found: warn
