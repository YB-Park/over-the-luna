name: Terra Phase 0 one-shot

# ONE-SHOT PAID PROBE. This workflow is intentionally created only long enough
# to launch one fixed-SHA Copilot CLI run, then deleted immediately.
on:
  push:
    branches:
      - experiment/terra-deep-judgment
    paths:
      - .github/workflows/terra_phase0_once.yml

permissions:
  contents: read
  copilot-requests: write

jobs:
  phase0:
    runs-on: ubuntu-latest
    steps:
      - name: Check out experiment branch
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          python -m pip install 'PyYAML==6.0.2'
          npm install -g @github/copilot
          copilot --version | tee "${{ runner.temp }}/copilot-version.txt"
          python scripts/validate_plugin.py

      - name: Capture clean pre-run state
        run: |
          git status --short > "${{ runner.temp }}/pre-status.txt"
          git diff --no-ext-diff > "${{ runner.temp }}/pre.diff"

      - name: Run Terra structural smoke
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COPILOT_OTEL_FILE_EXPORTER_PATH: ${{ runner.temp }}/terra-phase0-otel.jsonl
          COPILOT_OTEL_CAPTURE_CONTENT: 'false'
          PHASE0_PROMPT: >-
            PHASE 0 STRUCTURAL SMOKE ONLY. Do not implement, edit files, run shell commands,
            or perform external side effects. This experiment is checking the Deep Judgment
            runtime boundary. Use Luna Architect exactly once to inspect the current repository's
            core architecture invariants. Do not invoke Planner, Skeptic, Researcher, Reviewer,
            Premium Review, or any other agent. Then decide whether this request itself justifies
            Terra Deep Judgment. Because the request is only a bounded architecture-invariant
            lookup with no competing consequential decision, NOT_JUSTIFIED is the expected
            judgment if the evidence supports that conclusion. Follow Deep Judgment's required
            output contract exactly. Do not use the implementation handoff.
        run: |
          set -o pipefail
          copilot             --plugin-dir=.             --agent='over-the-luna:deep-judgment'             --model=gpt-5.6-terra             --available-tools='task,list_agents,read_agent'             --allow-all-tools             --max-ai-credits=20             --no-remote-export             --output-format=json             --prompt="$PHASE0_PROMPT"             | tee "${{ runner.temp }}/terra-phase0-output.jsonl"

      - name: Verify no repository mutation
        if: always()
        run: |
          git status --short > "${{ runner.temp }}/post-status.txt"
          git diff --no-ext-diff > "${{ runner.temp }}/post.diff"
          if ! cmp -s "${{ runner.temp }}/pre.diff" "${{ runner.temp }}/post.diff"; then
            echo 'ERROR: Deep Judgment mutated the repository.' >&2
            exit 1
          fi
          if [ -s "${{ runner.temp }}/post-status.txt" ]; then
            echo 'ERROR: Deep Judgment left workspace changes:' >&2
            cat "${{ runner.temp }}/post-status.txt" >&2
            exit 1
          fi

      - name: Upload Phase 0 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terra-phase0-structural-smoke
          path: |
            ${{ runner.temp }}/copilot-version.txt
            ${{ runner.temp }}/terra-phase0-output.jsonl
            ${{ runner.temp }}/terra-phase0-otel.jsonl
            ${{ runner.temp }}/pre-status.txt
            ${{ runner.temp }}/post-status.txt
            ${{ runner.temp }}/pre.diff
            ${{ runner.temp }}/post.diff
          if-no-files-found: warn
