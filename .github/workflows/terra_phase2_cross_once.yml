name: Terra Phase 2 cross-cutting E2E one-shot

on:
  push:
    branches:
      - experiment/terra-deep-judgment
    paths:
      - .github/workflows/terra_phase2_cross_once.yml

permissions:
  contents: read
  copilot-requests: write

jobs:
  cross-cutting:
    runs-on: ubuntu-latest
    steps:
      - name: Check out experiment harness
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install Copilot CLI
        run: |
          npm install -g @github/copilot
          copilot --version | tee "${{ runner.temp }}/copilot-version.txt"

      - name: Snapshot experiment plugin
        run: |
          mkdir -p "${{ runner.temp }}/otl-plugin"
          cp plugin.json "${{ runner.temp }}/otl-plugin/plugin.json"
          cp -R agents "${{ runner.temp }}/otl-plugin/agents"

      - name: Prepare identical historical Django workspaces
        run: |
          cd "${{ runner.temp }}"
          git clone --quiet https://github.com/django/django.git django-baseline
          git clone --quiet https://github.com/django/django.git django-candidate
          cd django-baseline
          git checkout --quiet b3dc80682e678b20c89fb2a430c0bc77960a29ac
          python -m pip install -e . >/dev/null
          test -z "$(git status --porcelain)"
          cd ../django-candidate
          git checkout --quiet b3dc80682e678b20c89fb2a430c0bc77960a29ac
          python -m pip install -e . >/dev/null
          test -z "$(git status --porcelain)"

      - name: Baseline implementation
        working-directory: ${{ runner.temp }}/django-baseline
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COPILOT_OTEL_FILE_EXPORTER_PATH: ${{ runner.temp }}/cross-baseline-otel.jsonl
          COPILOT_OTEL_CAPTURE_CONTENT: 'false'
          TASK_PROMPT: >-
            HELD-OUT CROSS-CUTTING LIFECYCLE IMPLEMENTATION. Do not inspect git history or
            use external services. In this historical Django snapshot, ASGIHandler races
            request/view processing against an incoming http.disconnect and cancels the losing
            task. A disconnect can occur before a response exists or while a response is being
            sent. Cleanup may therefore be cancelled too: request/response resources may not
            be closed and request_finished may fail to fire, potentially leaking database or
            other request-scoped resources. Implement the smallest robust lifecycle fix.
            Requirements: request_finished/response cleanup must occur exactly once; async view
            processing should still be cancellable on disconnect; synchronous view work already
            running in its thread must not have request body/resources invalidated underneath it;
            normal and streaming responses must preserve existing send behavior; request creation
            errors must still close the error response. Add focused regression coverage for the
            consequential cancellation paths and run the relevant ASGI tests. Do not consult
            later commits or PRs.
        run: |
          set -o pipefail
          copilot             --plugin-dir="${{ runner.temp }}/otl-plugin"             --agent='over-the-luna:over-the-luna'             --model=gpt-5.6-luna             --available-tools='view,glob,rg,apply_patch,bash,task,list_agents,read_agent'             --allow-all-tools             --max-ai-credits=60             --no-remote-export             --output-format=json             --prompt="$TASK_PROMPT"             | tee "${{ runner.temp }}/cross-baseline-output.jsonl"
          git diff --no-ext-diff > "${{ runner.temp }}/cross-baseline.diff"
          git status --short > "${{ runner.temp }}/cross-baseline.status"

      - name: Baseline focused validation
        if: always()
        working-directory: ${{ runner.temp }}/django-baseline
        run: |
          set +e
          python tests/runtests.py asgi --verbosity 1 > "${{ runner.temp }}/cross-baseline-tests.txt" 2>&1
          code=$?
          echo "$code" > "${{ runner.temp }}/cross-baseline-tests.exit"
          cat "${{ runner.temp }}/cross-baseline-tests.txt"
          exit 0

      - name: Candidate Deep Judgment
        working-directory: ${{ runner.temp }}/django-candidate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COPILOT_OTEL_FILE_EXPORTER_PATH: ${{ runner.temp }}/cross-judgment-otel.jsonl
          COPILOT_OTEL_CAPTURE_CONTENT: 'false'
          JUDGMENT_PROMPT: >-
            HELD-OUT CROSS-CUTTING LIFECYCLE JUDGMENT. READ-ONLY. Do not edit files, run shell
            commands, inspect git history, or use external services. In this historical Django
            snapshot, ASGIHandler races request/view processing against an incoming
            http.disconnect and cancels the losing task. A disconnect can occur before a
            response exists or while a response is being sent. Cleanup may therefore be
            cancelled too: request/response resources may not be closed and request_finished
            may fail to fire, potentially leaking database or other request-scoped resources.
            Determine the smallest robust execution contract. It must preserve cancellation of
            async view processing, avoid invalidating resources underneath synchronous view work
            already running in a thread, ensure response/request cleanup and request_finished
            occur exactly once on all relevant paths, preserve normal/streaming send semantics,
            and handle request-creation errors correctly. Do not assume any later patch exists.
            Follow Deep Judgment's required output contract.
        run: |
          set -o pipefail
          copilot             --plugin-dir="${{ runner.temp }}/otl-plugin"             --agent='over-the-luna:deep-judgment'             --model=gpt-5.6-terra             --available-tools='view,glob,rg,task,list_agents,read_agent'             --allow-all-tools             --max-ai-credits=40             --no-remote-export             --output-format=json             --prompt="$JUDGMENT_PROMPT"             | tee "${{ runner.temp }}/cross-judgment-output.jsonl"
          test -z "$(git status --porcelain)"
          python - <<'PY'
          import json, os, pathlib
          root = pathlib.Path(os.environ["RUNNER_TEMP"])
          src = root / "cross-judgment-output.jsonl"
          out = root / "cross-judgment-final.txt"
          msgs=[]
          for line in src.read_text().splitlines():
              try:
                  e=json.loads(line)
              except Exception:
                  continue
              if e.get("type")=="assistant.message":
                  c=(e.get("data") or {}).get("content")
                  if c:
                      msgs.append(c)
          out.write_text(msgs[-1] if msgs else "")
          PY

      - name: Candidate implementation with judgment contract
        working-directory: ${{ runner.temp }}/django-candidate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COPILOT_OTEL_FILE_EXPORTER_PATH: ${{ runner.temp }}/cross-candidate-otel.jsonl
          COPILOT_OTEL_CAPTURE_CONTENT: 'false'
        run: |
          cat > "${{ runner.temp }}/cross-candidate-prompt.txt" <<'EOF'
          HELD-OUT CROSS-CUTTING LIFECYCLE IMPLEMENTATION. Do not inspect git history or use
          external services. Fix the ASGI disconnect/cancellation lifecycle bug described below
          and run focused tests.

          Symptom and constraints:
          ASGIHandler races request/view processing against http.disconnect. Cancellation can
          occur before a response exists or while it is being sent, and cleanup/request_finished
          can be lost. Preserve async-view cancellation, synchronous-view safety, normal and
          streaming response semantics, exactly-once cleanup/signal behavior, and request-error
          cleanup.

          A human-selected Deep Judgment checkpoint produced this pre-change decision contract.
          Treat it as evidence and constraints, not as authority over repository facts. Re-open
          only if current code contradicts it:

          ----- BEGIN DEEP JUDGMENT -----
          EOF
          cat "${{ runner.temp }}/cross-judgment-final.txt" >> "${{ runner.temp }}/cross-candidate-prompt.txt"
          cat >> "${{ runner.temp }}/cross-candidate-prompt.txt" <<'EOF'
          ----- END DEEP JUDGMENT -----

          Implement the smallest coherent fix. Main remains the sole mutation owner.
          EOF
          set -o pipefail
          copilot             --plugin-dir="${{ runner.temp }}/otl-plugin"             --agent='over-the-luna:over-the-luna'             --model=gpt-5.6-luna             --available-tools='view,glob,rg,apply_patch,bash,task,list_agents,read_agent'             --allow-all-tools             --max-ai-credits=60             --no-remote-export             --output-format=json             --prompt="$(cat "${{ runner.temp }}/cross-candidate-prompt.txt")"             | tee "${{ runner.temp }}/cross-candidate-output.jsonl"
          git diff --no-ext-diff > "${{ runner.temp }}/cross-candidate.diff"
          git status --short > "${{ runner.temp }}/cross-candidate.status"

      - name: Candidate focused validation
        if: always()
        working-directory: ${{ runner.temp }}/django-candidate
        run: |
          set +e
          python tests/runtests.py asgi --verbosity 1 > "${{ runner.temp }}/cross-candidate-tests.txt" 2>&1
          code=$?
          echo "$code" > "${{ runner.temp }}/cross-candidate-tests.exit"
          cat "${{ runner.temp }}/cross-candidate-tests.txt"
          exit 0

      - name: Upload Phase 2 cross-cutting artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terra-phase2-cross-cutting-django-asgi-cleanup
          path: |
            ${{ runner.temp }}/copilot-version.txt
            ${{ runner.temp }}/cross-baseline-output.jsonl
            ${{ runner.temp }}/cross-baseline-otel.jsonl
            ${{ runner.temp }}/cross-baseline.diff
            ${{ runner.temp }}/cross-baseline.status
            ${{ runner.temp }}/cross-baseline-tests.txt
            ${{ runner.temp }}/cross-baseline-tests.exit
            ${{ runner.temp }}/cross-judgment-output.jsonl
            ${{ runner.temp }}/cross-judgment-otel.jsonl
            ${{ runner.temp }}/cross-judgment-final.txt
            ${{ runner.temp }}/cross-candidate-prompt.txt
            ${{ runner.temp }}/cross-candidate-output.jsonl
            ${{ runner.temp }}/cross-candidate-otel.jsonl
            ${{ runner.temp }}/cross-candidate.diff
            ${{ runner.temp }}/cross-candidate.status
            ${{ runner.temp }}/cross-candidate-tests.txt
            ${{ runner.temp }}/cross-candidate-tests.exit
          if-no-files-found: warn
