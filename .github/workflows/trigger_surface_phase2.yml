name: Trigger surface economy Phase 2

on:
  push:
    branches:
      - run/v1.1.1-surface-phase2

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch main Phase 2 workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/v1_1_1_surface_economy_phase2.yml/dispatches \
            -d '{"ref":"main","inputs":{"experiment_ref":"research/v1.1.1-surface-economy-phase2"}}'
