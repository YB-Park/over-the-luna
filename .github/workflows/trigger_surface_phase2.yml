name: Trigger surface economy Phase 2

on:
  push:
    branches:
      - run/v1.1.1-surface-phase2
    paths:
      - .github/workflows/trigger_surface_phase2.yml

permissions:
  actions: write
  contents: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out trigger branch
        uses: actions/checkout@v6

      - name: Find recent Phase 2 run or dispatch one
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${{ github.repository }}/actions/workflows/v1_1_1_surface_economy_phase2.yml"

          find_recent() {
            curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$api/runs?branch=main&event=workflow_dispatch&per_page=5" \
              | python -c 'import json,sys; data=json.load(sys.stdin); runs=data.get("workflow_runs", []); print(runs[0]["id"] if runs else "")'
          }

          run_id="$(find_recent)"
          if [ -z "$run_id" ]; then
            curl --fail-with-body \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$api/dispatches" \
              -d '{"ref":"main","inputs":{"experiment_ref":"research/v1.1.1-surface-economy-phase2"}}'
            for _ in $(seq 1 15); do
              sleep 2
              run_id="$(find_recent)"
              [ -n "$run_id" ] && break
            done
          fi

          if [ -z "$run_id" ]; then
            echo "Could not resolve dispatched Phase 2 run id" >&2
            exit 1
          fi

          printf '%s\n' "$run_id" > phase2_target_run_id.txt
          printf 'https://github.com/${{ github.repository }}/actions/runs/%s\n' "$run_id" > phase2_target_run_url.txt
          echo "Resolved Phase 2 run: $run_id"

      - name: Publish target run marker
        run: |
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git config user.name 'github-actions[bot]'
          git add -- phase2_target_run_id.txt phase2_target_run_url.txt
          git commit -m 'Record Phase 2 target run' || exit 0
          git push
