name: v1.1 one-shot premium judgment evaluation

# ONE-SHOT PAID PREMIUM RESEARCH WORKFLOW. Delete immediately after artifact collection.
on:
  pull_request:
    paths:
      - '.github/workflows/v1_1_premium_eval_once.yml'
  workflow_dispatch:

permissions:
  contents: read
  copilot-requests: write

jobs:
  premium-review:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        model: [sonnet, opus]
        artifact: [defect, correct]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install Copilot CLI
        run: |
          npm install -g @github/copilot
          copilot --version | tee "${RUNNER_TEMP}/copilot-version.txt"

      - name: Build isolated premium-review plugin
        env:
          MODEL_SLOT: ${{ matrix.model }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/premium-plugin/agents" "${RUNNER_TEMP}/empty-workspace"
          if [ "$MODEL_SLOT" = sonnet ]; then
            MODEL_NAME='Claude Sonnet 5'
          else
            MODEL_NAME='Claude Opus 4.8'
          fi
          printf '%s\n' \
            '{' \
            '  "name": "premium-eval",' \
            '  "description": "Isolated v1.1 premium judgment experiment",' \
            '  "version": "0.0.0",' \
            '  "agents": "agents/"' \
            '}' > "${RUNNER_TEMP}/premium-plugin/plugin.json"
          cat > "${RUNNER_TEMP}/premium-plugin/agents/premium-review.agent.md" <<EOF
          ---
          name: Premium Review
          description: Isolated read-only model-comparison reviewer for a supplied artifact.
          target: vscode
          model: ${MODEL_NAME}
          disable-model-invocation: true
          tools: []
          agents: []
          ---
          # Premium Review evaluation

          Follow the user-supplied evaluation prompt exactly. Do not use tools or external context. Do not edit anything. Do not delegate.
          EOF
          echo "$MODEL_NAME" > "${RUNNER_TEMP}/requested-model.txt"

      - name: Select artifact prompt
        env:
          ARTIFACT_SLOT: ${{ matrix.artifact }}
        run: |
          set -euo pipefail
          if [ "$ARTIFACT_SLOT" = defect ]; then
            cp experiments/premium_eval_defect_prompt.txt "${RUNNER_TEMP}/review-prompt.txt"
          else
            cp experiments/premium_eval_correct_prompt.txt "${RUNNER_TEMP}/review-prompt.txt"
          fi

      - name: Run isolated premium review
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COPILOT_OTEL_FILE_EXPORTER_PATH: ${{ runner.temp }}/otel.jsonl
          COPILOT_OTEL_CAPTURE_CONTENT: 'false'
        run: |
          set +e
          cd "${RUNNER_TEMP}/empty-workspace"
          start="$(date +%s)"
          copilot \
            --plugin-dir="${RUNNER_TEMP}/premium-plugin" \
            --agent='premium-eval:premium-review' \
            --max-ai-credits=30 \
            --no-remote-export \
            --output-format=json \
            --prompt="$(cat "${RUNNER_TEMP}/review-prompt.txt")" \
            > "${RUNNER_TEMP}/output.jsonl" 2> "${RUNNER_TEMP}/stderr.txt"
          code=$?
          end="$(date +%s)"
          echo "$code" > "${RUNNER_TEMP}/copilot.exit"
          echo "$((end-start))" > "${RUNNER_TEMP}/elapsed-seconds.txt"
          cat "${RUNNER_TEMP}/output.jsonl" || true
          cat "${RUNNER_TEMP}/stderr.txt" >&2 || true
          exit 0

      - name: Summarize premium trace
        if: always()
        run: |
          set +e
          if [ -s "${RUNNER_TEMP}/otel.jsonl" ]; then
            python scripts/analyze_otel.py "${RUNNER_TEMP}/otel.jsonl" --json \
              > "${RUNNER_TEMP}/trace-summary.json" 2> "${RUNNER_TEMP}/trace-summary.err"
          fi
          exit 0

      - name: Upload premium evaluation artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: premium-${{ matrix.model }}-${{ matrix.artifact }}
          path: |
            ${{ runner.temp }}/requested-model.txt
            ${{ runner.temp }}/copilot-version.txt
            ${{ runner.temp }}/review-prompt.txt
            ${{ runner.temp }}/output.jsonl
            ${{ runner.temp }}/stderr.txt
            ${{ runner.temp }}/copilot.exit
            ${{ runner.temp }}/elapsed-seconds.txt
            ${{ runner.temp }}/otel.jsonl
            ${{ runner.temp }}/trace-summary.json
            ${{ runner.temp }}/trace-summary.err
          if-no-files-found: warn
