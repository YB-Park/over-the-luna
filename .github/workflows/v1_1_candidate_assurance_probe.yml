name: v1.1 candidate assurance adherence probe

# ONE-SHOT RESEARCH TRIGGER. This file is deleted immediately after the run starts.
# Its temporary automatic trigger is intentionally caught by the paid-workflow
# runtime contract; do not copy this pattern into product workflows.
on:
  pull_request:
    types: [synchronize]
    branches: ['research/v1.1-runtime-baseline']
    paths:
      - .github/workflows/v1_1_candidate_assurance_probe.yml

permissions:
  contents: read
  copilot-requests: write

jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out candidate
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          python -m pip install 'PyYAML==6.0.2'
          npm install -g @github/copilot
          copilot --version

      - name: Preserve baseline analyzer
        run: cp scripts/analyze_otel.py "${{ runner.temp }}/baseline-analyze-otel.py"

      - name: Run candidate policy on baseline Sample 1 task
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COPILOT_OTEL_FILE_EXPORTER_PATH: ${{ runner.temp }}/candidate-otel.jsonl
          COPILOT_OTEL_CAPTURE_CONTENT: 'false'
          TASK_PROMPT: >-
            V1.1 CONTROLLED MUTATION EXPERIMENT. Work only in scripts/analyze_otel.py and
            tests/test_analyze_otel.py unless a tiny adjacent change is strictly required.
            Improve the OTel experiment analyzer so execute_tool spans are attributed to the
            nearest invoking agent, not only counted globally. Preserve the existing global tool
            totals. Expose Main-versus-Council tool counts and the agent that owns the first detected
            mutation tool in machine-readable and Markdown summaries. Reuse the existing span-parent
            traversal rather than inventing a second ownership model. Add focused regression tests
            proving Main and Council tool attribution and mutation ownership. Run the focused tests.
            Follow the installed Over the Luna routing and assurance instructions normally.
            Do not add Council calls merely because this is an experiment. Do not use or request
            premium review.
        run: |
          set -o pipefail
          copilot \
            --plugin-dir=. \
            --agent='over-the-luna:over-the-luna' \
            --model=gpt-5.6-luna \
            --available-tools='view,glob,rg,apply_patch,bash,task,list_agents,read_agent' \
            --allow-all-tools \
            --max-ai-credits=30 \
            --no-remote-export \
            --output-format=json \
            --prompt="$TASK_PROMPT" \
            | tee "${{ runner.temp }}/candidate-output.jsonl"

      - name: Capture candidate artifact
        if: always()
        run: |
          git diff --no-ext-diff > "${{ runner.temp }}/candidate.diff"
          git status --short > "${{ runner.temp }}/candidate-status.txt"
          set +e
          python -m unittest discover -s tests -v > "${{ runner.temp }}/candidate-validation.txt" 2>&1
          echo "$?" > "${{ runner.temp }}/candidate-validation.exit"
          cat "${{ runner.temp }}/candidate-validation.txt"
          exit 0

      - name: Summarize candidate trace with preserved analyzer
        if: always()
        run: |
          if [ -f "${{ runner.temp }}/candidate-otel.jsonl" ]; then
            python "${{ runner.temp }}/baseline-analyze-otel.py" \
              "${{ runner.temp }}/candidate-otel.jsonl" \
              --events "${{ runner.temp }}/candidate-output.jsonl" \
              | tee "${{ runner.temp }}/candidate-summary.md"
          fi

      - name: Upload candidate artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v1.1-candidate-assurance-probe
          path: |
            ${{ runner.temp }}/candidate-output.jsonl
            ${{ runner.temp }}/candidate-otel.jsonl
            ${{ runner.temp }}/candidate-summary.md
            ${{ runner.temp }}/candidate.diff
            ${{ runner.temp }}/candidate-status.txt
            ${{ runner.temp }}/candidate-validation.txt
            ${{ runner.temp }}/candidate-validation.exit
          if-no-files-found: warn
