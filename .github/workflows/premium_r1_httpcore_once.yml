name: Premium harness R1 httpcore one-shot

on:
  push:
    branches:
      - experiment/premium-luna-orchestration
    paths:
      - .github/workflows/premium_r1_httpcore_once.yml

permissions:
  contents: read
  copilot-requests: write

jobs:
  r1-httpcore:
    runs-on: ubuntu-latest
    steps:
      - name: Check out experiment harness
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install tooling
        run: |
          npm install -g @github/copilot
          copilot --version | tee "${{ runner.temp }}/copilot-version.txt"
          python -m pip install --upgrade pip
          python -m pip install             'h11>=0.13,<0.15' 'sniffio==1.*' 'anyio==3.6.2' certifi             'trio==0.21.0' 'pytest==7.2.0' 'pytest-trio==0.7.0'             'h2>=3,<5' 'socksio==1.*'

      - name: Snapshot premium plugin
        run: |
          mkdir -p "${{ runner.temp }}/otl-plugin"
          cp plugin.json "${{ runner.temp }}/otl-plugin/plugin.json"
          cp -R agents "${{ runner.temp }}/otl-plugin/agents"

      - name: Prepare shallow historical workspace
        run: |
          dir="${{ runner.temp }}/httpcore-r1"
          mkdir -p "$dir"
          cd "$dir"
          git init -q
          git remote add origin https://github.com/encode/httpcore.git
          git fetch -q --depth=1 origin 5f2e454801f50051d5a66203401a67e5b2a32e9d
          git checkout -q --detach FETCH_HEAD
          test -z "$(git status --porcelain)"
          git rev-list --count HEAD | tee "${{ runner.temp }}/history-count.txt"

      - name: Run Premium Harness regression
        working-directory: ${{ runner.temp }}/httpcore-r1
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COPILOT_OTEL_FILE_EXPORTER_PATH: ${{ runner.temp }}/premium-r1-otel.jsonl
          COPILOT_OTEL_CAPTURE_CONTENT: 'false'
          TASK_PROMPT: >-
            PREMIUM HARNESS REGRESSION LAB R1. This is an already-known historical case used
            only to test the harness mechanism, not promotion quality. Do not inspect git history
            or use external services. This snapshot intermittently fails during concurrent async
            HTTP use with RuntimeError: dictionary changed size during iteration while importing
            anyio from httpcore/_synchronization.py, typically from AsyncLock.setup() under
            asyncio. After that failure, cleanup can also hit AttributeError because _anyio_lock
            was never initialized. The failure is timing-sensitive and has been observed more
            often under a debugger. Diagnose and implement the smallest robust fix while
            preserving asyncio/anyio, trio, and optional dependency behavior. Add focused
            regression coverage if justified and run relevant tests. This is a high-blast causal
            debugging task: obey the Critical Belief Gate before mutation. Do not assume a later
            patch or PR exists.
        run: |
          set -o pipefail
          copilot             --plugin-dir="${{ runner.temp }}/otl-plugin"             --agent='over-the-luna:premium-harness'             --model=gpt-5.6-terra             --available-tools='view,glob,rg,apply_patch,bash,task,list_agents,read_agent'             --allow-all-tools             --max-ai-credits=80             --no-remote-export             --output-format=json             --prompt="$TASK_PROMPT"             | tee "${{ runner.temp }}/premium-r1-output.jsonl"

          git diff --no-ext-diff > "${{ runner.temp }}/premium-r1.diff"
          git status --short > "${{ runner.temp }}/premium-r1.status"

      - name: Run regression oracle
        working-directory: ${{ runner.temp }}/httpcore-r1
        run: |
          set -o pipefail
          PYTHONPATH=. python -m pytest -q | tee "${{ runner.temp }}/premium-r1-tests.txt"

          python - <<'PY' | tee "${{ runner.temp }}/premium-r1-oracle.txt"
          import re
          from pathlib import Path

          text = Path("httpcore/_synchronization.py").read_text()
          lines = text.splitlines()

          lazy = [
              line for line in lines
              if re.match(r"^\s{8,}import\s+(?:anyio|trio)\b", line)
          ]
          assert not lazy, f"lazy backend imports remain: {lazy}"

          assert re.search(r"(?m)^\s{4}import anyio\s*$", text), "no module-scope conditional anyio import"
          assert re.search(r"(?m)^\s{4}import trio\s*$", text), "no module-scope conditional trio import"

          anyio_pos = text.find("import anyio")
          trio_pos = text.find("import trio")
          assert "except ImportError" in text[max(0, anyio_pos-80):anyio_pos+180]
          assert "except ImportError" in text[max(0, trio_pos-80):trio_pos+180]

          assert "threading.Lock" not in text, "lock-based lazy-import fix survived"
          print("R1_ACCEPTED_DIRECTION_PASS")
          PY

      - name: Upload R1 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: premium-harness-r1-httpcore
          path: |
            ${{ runner.temp }}/copilot-version.txt
            ${{ runner.temp }}/history-count.txt
            ${{ runner.temp }}/premium-r1-output.jsonl
            ${{ runner.temp }}/premium-r1-otel.jsonl
            ${{ runner.temp }}/premium-r1.diff
            ${{ runner.temp }}/premium-r1.status
            ${{ runner.temp }}/premium-r1-tests.txt
            ${{ runner.temp }}/premium-r1-oracle.txt
          if-no-files-found: warn
