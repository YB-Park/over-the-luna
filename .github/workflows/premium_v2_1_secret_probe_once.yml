name: Premium v2.1 secret presence probe

on:
  push:
    branches:
      - experiment/premium-v2-1-minimal-cascade

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Check Copilot PAT secret presence without exposing value
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        shell: bash
        run: |
          if [ -n "$COPILOT_GITHUB_TOKEN" ]; then
            echo "copilot_pat_secret_present=yes"
          else
            echo "copilot_pat_secret_present=no"
          fi
