name: Validate Next role topology (no model calls)
on:
  push:
    branches: [research/next-role-topology]
  pull_request:
    branches: [release/next-v2.0.0-rc1]
permissions:
  contents: read
jobs:
  role-topology:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned static YAML parser
        run: python -m pip install 'PyYAML==6.0.2'
      - name: Syntax-check future role-pipeline scripts (zero model inference)
        run: |
          node --check scripts/role_pipeline_pair.mjs
          node --check scripts/p12_direct_pair.mjs
          node --check scripts/p14_host_ahp_probe.mjs
          node --check scripts/p15_host_session_probe.mjs
          node scripts/p15_host_session_probe.mjs --self-test
          node scripts/p14_host_ahp_probe.mjs --self-test
          python scripts/p12_direct_grader.py --self-test
          python -m py_compile scripts/role_pipeline_grader.py
      - name: Independently regrade the fixed public release package boundary
        run: python scripts/role_pipeline_grader.py --work .
      - name: Validate all role configs and negative cases without AI calls
        run: |
          python -m compileall -q scripts tests
          python scripts/validate_release.py
          python -m unittest discover -s tests -p 'test_release.py' -v
      - name: Replay public P5 role and token evidence (no model calls)
        run: |
          python -m unittest discover -s tests -p 'test_role_trace_accounting.py' -v
          python scripts/role_trace_accounting.py --summary tests/fixtures/p5_role_accounting.json
      - name: Build allowlisted RC2 research ZIP
        run: python -m scripts.package_release --output "$RUNNER_TEMP/over-the-luna-next-rc2-topology.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: over-the-luna-next-rc2-topology
          path: ${{ runner.temp }}/over-the-luna-next-rc2-topology.zip
          retention-days: 14
          if-no-files-found: error
