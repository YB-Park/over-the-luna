name: Validate plugin

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validator dependency
        run: python -m pip install 'PyYAML==6.0.2'

      - name: Compile validator
        run: python -m compileall -q scripts

      - name: Validate plugin and agents
        run: python scripts/validate_plugin.py
