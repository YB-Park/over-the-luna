name: Validate Next release candidate (no model calls)
on:
  push:
    branches:
      - release/next-v2.0.0-rc1
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned YAML validator
        run: python -m pip install 'PyYAML==6.0.2'
      - name: Verify RC and negative mutation tests
        run: |
          python -m compileall -q scripts tests
          python scripts/validate_release.py
          python -m unittest discover -s tests -p 'test_release.py' -v
      - name: Build deterministic allowlisted preview archive
        run: python -m scripts.package_release --output "$RUNNER_TEMP/over-the-luna-next-v2.0.0-rc.1.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: over-the-luna-next-v2.0.0-rc.1
          path: ${{ runner.temp }}/over-the-luna-next-v2.0.0-rc.1.zip
          retention-days: 30
          if-no-files-found: error
