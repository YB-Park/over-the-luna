name: Validate plugin

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install validator dependency
        run: python -m pip install 'PyYAML==6.0.2'

      - name: Compile Python sources
        run: python -m compileall -q scripts tests

      - name: Run runtime contract tests
        run: python -m unittest discover -s tests -v

      - name: Validate plugin and agents
        run: python scripts/validate_plugin.py
