name: Validate plugin

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install validator dependency
        run: python -m pip install 'PyYAML==6.0.2'

      - name: Compile validator
        run: python -m compileall -q scripts

      - name: Validate plugin and agents
        run: python scripts/validate_plugin.py

      - name: Run Premium v2.1 zero-AI controller tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
