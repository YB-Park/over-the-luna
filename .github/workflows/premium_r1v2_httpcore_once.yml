name: Premium harness R1-v2 httpcore one-shot

on:
  push:
    branches:
      - experiment/premium-luna-orchestration
    paths:
      - .github/workflows/premium_r1v2_httpcore_once.yml

permissions:
  contents: read
  copilot-requests: write

jobs:
  r1v2-httpcore:
    runs-on: ubuntu-latest
    steps:
      - name: Check out experiment harness
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install tooling
        run: |
          npm install -g @github/copilot
          copilot --version | tee "${{ runner.temp }}/copilot-version.txt"
          python -m pip install --upgrade pip
          python -m pip install             'h11>=0.13,<0.15' 'sniffio==1.*' 'anyio==3.6.2' certifi             'trio==0.21.0' 'pytest==7.2.0' 'pytest-trio==0.7.0'             'h2>=3,<5' 'socksio==1.*'

      - name: Snapshot premium plugin
        run: |
          mkdir -p "${{ runner.temp }}/otl-plugin"
          cp plugin.json "${{ runner.temp }}/otl-plugin/plugin.json"
          cp -R agents "${{ runner.temp }}/otl-plugin/agents"

      - name: Prepare shallow historical workspace
        run: |
          dir="${{ runner.temp }}/httpcore-r1v2"
          mkdir -p "$dir"
          cd "$dir"
          git init -q
          git remote add origin https://github.com/encode/httpcore.git
          git fetch -q --depth=1 origin 5f2e454801f50051d5a66203401a67e5b2a32e9d
          git checkout -q --detach FETCH_HEAD
          test -z "$(git status --porcelain)"
          git rev-list --count HEAD | tee "${{ runner.temp }}/history-count.txt"

      - name: Run Premium Harness regression v2
        working-directory: ${{ runner.temp }}/httpcore-r1v2
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COPILOT_OTEL_FILE_EXPORTER_PATH: ${{ runner.temp }}/premium-r1v2-otel.jsonl
          COPILOT_OTEL_CAPTURE_CONTENT: 'false'
          TASK_PROMPT: >-
            PREMIUM HARNESS REGRESSION LAB R1-v2. This is an already-known historical case
            used only to test the harness mechanism, not promotion quality. Do not inspect git
            history or use external services. This snapshot intermittently fails during
            concurrent async HTTP use with RuntimeError: dictionary changed size during
            iteration while importing anyio from httpcore/_synchronization.py, typically from
            AsyncLock.setup() under asyncio. After that failure, cleanup can also hit
            AttributeError because _anyio_lock was never initialized. The failure is
            timing-sensitive and has been observed more often under a debugger. Diagnose and
            implement the smallest robust fix while preserving asyncio/anyio, trio, and
            optional dependency behavior. Add focused regression coverage if justified and run
            relevant tests. This is a high-blast causal debugging task: obey the Critical Belief
            Gate before mutation. Do not assume a later patch or PR exists.
        run: |
          set -o pipefail
          copilot             --plugin-dir="${{ runner.temp }}/otl-plugin"             --agent='over-the-luna:premium-harness'             --model=gpt-5.6-terra             --available-tools='view,glob,rg,apply_patch,bash,task,list_agents,read_agent'             --allow-all-tools             --max-ai-credits=70             --no-remote-export             --output-format=json             --prompt="$TASK_PROMPT"             | tee "${{ runner.temp }}/premium-r1v2-output.jsonl"

          git diff --no-ext-diff > "${{ runner.temp }}/premium-r1v2.diff"
          git status --short > "${{ runner.temp }}/premium-r1v2.status"

      - name: Run focused regression and accepted-direction oracle
        working-directory: ${{ runner.temp }}/httpcore-r1v2
        run: |
          set +e
          PYTHONPATH=. python -m pytest -q             tests/_async/test_connection.py             tests/_async/test_connection_pool.py             tests/_async/test_http2.py             tests/_async/test_http_proxy.py             tests/_async/test_socks_proxy.py             > "${{ runner.temp }}/premium-r1v2-tests.txt" 2>&1
          tests_code=$?
          cat "${{ runner.temp }}/premium-r1v2-tests.txt"

          python - <<'PY' > "${{ runner.temp }}/premium-r1v2-oracle.txt" 2>&1
          import re
          from pathlib import Path

          text = Path("httpcore/_synchronization.py").read_text()
          lines = text.splitlines()

          lazy = [
              line for line in lines
              if re.match(r"^\s{8,}import\s+(?:anyio|trio)\b", line)
          ]
          assert not lazy, f"lazy backend imports remain: {lazy}"

          assert re.search(r"(?m)^\s{4}import anyio\s*$", text), "no module-level conditional anyio import"
          assert re.search(r"(?m)^\s{4}import trio\s*$", text), "no module-level conditional trio import"

          anyio_at = text.find("import anyio")
          trio_at = text.find("import trio")
          assert anyio_at >= 0 and trio_at >= 0
          assert "except ImportError" in text[max(0, anyio_at-80):anyio_at+220]
          assert "except ImportError" in text[max(0, trio_at-80):trio_at+220]

          assert "threading.Lock" not in text, "lock-based lazy-import repair survived"
          print("R1_ACCEPTED_DIRECTION_PASS")
          PY
          oracle_code=$?
          cat "${{ runner.temp }}/premium-r1v2-oracle.txt"

          echo "$tests_code" > "${{ runner.temp }}/premium-r1v2-tests.exit"
          echo "$oracle_code" > "${{ runner.temp }}/premium-r1v2-oracle.exit"

          if [ "$tests_code" -ne 0 ] || [ "$oracle_code" -ne 0 ]; then
            exit 1
          fi

      - name: Upload R1-v2 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: premium-harness-r1v2-httpcore
          path: |
            ${{ runner.temp }}/copilot-version.txt
            ${{ runner.temp }}/history-count.txt
            ${{ runner.temp }}/premium-r1v2-output.jsonl
            ${{ runner.temp }}/premium-r1v2-otel.jsonl
            ${{ runner.temp }}/premium-r1v2.diff
            ${{ runner.temp }}/premium-r1v2.status
            ${{ runner.temp }}/premium-r1v2-tests.txt
            ${{ runner.temp }}/premium-r1v2-tests.exit
            ${{ runner.temp }}/premium-r1v2-oracle.txt
            ${{ runner.temp }}/premium-r1v2-oracle.exit
          if-no-files-found: warn
