name: v1.1 one-shot external integrated candidate replication

# ONE-SHOT PAID RESEARCH WORKFLOW. Delete after artifact collection.
on:
  pull_request:
    paths:
      - '.github/workflows/v1_1_external_integrated_once.yml'
  workflow_dispatch:

permissions:
  contents: read
  copilot-requests: write

jobs:
  external-integrated:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        repeat: [1, 2]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install Copilot CLI
        run: |
          npm install -g @github/copilot
          copilot --version

      - name: Prepare integrated candidate plugin
        run: |
          set -euo pipefail
          cp -a "$GITHUB_WORKSPACE" "${RUNNER_TEMP}/plugin"
          cp "$GITHUB_WORKSPACE/experiments/v1_1_candidate_integrated.agent.md" \
             "${RUNNER_TEMP}/plugin/agents/over-the-luna.agent.md"
          cp "$GITHUB_WORKSPACE/experiments/v1_1_candidate_architect_packet.agent.md" \
             "${RUNNER_TEMP}/plugin/agents/luna-architect.agent.md"
          cp "$GITHUB_WORKSPACE/experiments/v1_1_candidate_invariant_reviewer.agent.md" \
             "${RUNNER_TEMP}/plugin/agents/luna-reviewer.agent.md"

      - name: Create standalone TTL cache fixture
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/fixture/ttlcache" "${RUNNER_TEMP}/fixture/tests"
          cat > "${RUNNER_TEMP}/fixture/ttlcache/__init__.py" <<'PY'
          from .cache import TTLCache

          __all__ = ["TTLCache"]
          PY
          cat > "${RUNNER_TEMP}/fixture/ttlcache/cache.py" <<'PY'
          from __future__ import annotations

          from collections import OrderedDict
          from collections.abc import Callable


          class TTLCache:
              def __init__(self, capacity: int, ttl: float, clock: Callable[[], float]) -> None:
                  if capacity <= 0:
                      raise ValueError("capacity must be positive")
                  if ttl < 0:
                      raise ValueError("ttl must be non-negative")
                  self.capacity = capacity
                  self.ttl = ttl
                  self.clock = clock
                  self._entries: OrderedDict[str, tuple[object, float]] = OrderedDict()

              def get(self, key: str, default: object = None) -> object:
                  item = self._entries.get(key)
                  if item is None:
                      return default
                  value, expires_at = item
                  if expires_at <= self.clock():
                      del self._entries[key]
                      return default
                  self._entries.move_to_end(key)
                  return value

              def set(self, key: str, value: object) -> None:
                  now = self.clock()
                  expires_at = now + self.ttl
                  if len(self._entries) >= self.capacity:
                      self._entries.popitem(last=False)
                  self._entries[key] = (value, expires_at)
                  self._entries.move_to_end(key)
          PY
          cat > "${RUNNER_TEMP}/fixture/tests/test_cache.py" <<'PY'
          import unittest

          from ttlcache import TTLCache


          class Clock:
              def __init__(self) -> None:
                  self.now = 0.0

              def __call__(self) -> float:
                  return self.now

              def advance(self, seconds: float) -> None:
                  self.now += seconds


          class TTLCacheTests(unittest.TestCase):
              def test_get_refreshes_lru_and_capacity_evicts_lru(self) -> None:
                  clock = Clock()
                  cache = TTLCache(2, 30, clock)
                  cache.set("a", 1)
                  cache.set("b", 2)
                  self.assertEqual(cache.get("a"), 1)
                  cache.set("c", 3)
                  self.assertIsNone(cache.get("b"))
                  self.assertEqual(cache.get("a"), 1)
                  self.assertEqual(cache.get("c"), 3)

              def test_get_removes_expired_entry(self) -> None:
                  clock = Clock()
                  cache = TTLCache(2, 5, clock)
                  cache.set("a", 1)
                  clock.advance(5)
                  self.assertIsNone(cache.get("a"))

              def test_constructor_validation(self) -> None:
                  clock = Clock()
                  with self.assertRaises(ValueError):
                      TTLCache(0, 5, clock)
                  with self.assertRaises(ValueError):
                      TTLCache(1, -1, clock)


          if __name__ == "__main__":
              unittest.main()
          PY
          cat > "${RUNNER_TEMP}/fixture/README.md" <<'MD'
          # Tiny TTL cache fixture

          `TTLCache` stores fixed-TTL entries in LRU order. `get` promotes a live hit to MRU and removes an expired requested key.
          MD
          cd "${RUNNER_TEMP}/fixture"
          git init -q
          git config user.name fixture
          git config user.email fixture@example.invalid
          git add .
          git commit -qm baseline

      - name: Run integrated candidate on external mutation
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COPILOT_OTEL_FILE_EXPORTER_PATH: ${{ runner.temp }}/otel.jsonl
          COPILOT_OTEL_CAPTURE_CONTENT: 'false'
          TASK_PROMPT: >-
            Fix TTLCache.set so updating an existing key refreshes its value, expiry, and MRU position
            without evicting another live key even when the cache is at capacity. Before any capacity
            eviction, purge expired entries. If a live eviction is still required, evict exactly the
            live LRU entry. Preserve TTLCache.get behavior and the public constructor/API. Add focused
            regression tests for update-at-capacity, refreshed expiry, and expired-before-live eviction.
            Run the focused and full tests. Follow the installed Over the Luna investigation and assurance
            policy naturally. Main remains the only mutation owner. Do not use premium review.
        run: |
          set -o pipefail
          cd "${RUNNER_TEMP}/fixture"
          copilot \
            --plugin-dir="${RUNNER_TEMP}/plugin" \
            --agent='over-the-luna:over-the-luna' \
            --model=gpt-5.6-luna \
            --available-tools='view,glob,rg,apply_patch,bash,task,list_agents,read_agent' \
            --allow-all-tools \
            --max-ai-credits=30 \
            --no-remote-export \
            --output-format=json \
            --prompt="$TASK_PROMPT" \
            | tee "${RUNNER_TEMP}/output.jsonl"

      - name: Capture final external patch
        if: always()
        run: |
          git -C "${RUNNER_TEMP}/fixture" diff --no-ext-diff > "${RUNNER_TEMP}/candidate.diff"
          git -C "${RUNNER_TEMP}/fixture" status --short > "${RUNNER_TEMP}/fixture-status.txt"

      - name: Run visible fixture tests
        if: always()
        run: |
          set +e
          cd "${RUNNER_TEMP}/fixture"
          python -m unittest discover -s tests -v > "${RUNNER_TEMP}/visible-tests.txt" 2>&1
          echo "$?" > "${RUNNER_TEMP}/visible-tests.exit"
          cat "${RUNNER_TEMP}/visible-tests.txt"
          exit 0

      - name: Add and run hidden acceptance tests
        if: always()
        run: |
          set +e
          cd "${RUNNER_TEMP}/fixture"
          cat > "${RUNNER_TEMP}/hidden_cache.py" <<'PY'
          from ttlcache import TTLCache


          class Clock:
              def __init__(self):
                  self.now = 0.0
              def __call__(self):
                  return self.now
              def advance(self, seconds):
                  self.now += seconds


          # Updating at capacity must not evict another live key, and expiry must refresh.
          clock = Clock()
          cache = TTLCache(2, 10, clock)
          cache.set("a", "old")
          cache.set("b", "keep")
          clock.advance(5)
          cache.set("a", "new")
          assert cache.get("b") == "keep"
          clock.advance(6)  # old expiry would be 10; refreshed expiry is 15
          assert cache.get("a") == "new"

          # Expired entries must be purged before a live LRU is evicted.
          clock = Clock()
          cache = TTLCache(2, 10, clock)
          cache.set("expired", 1)
          clock.advance(5)
          cache.set("live", 2)
          clock.advance(6)  # expired is dead, live remains valid
          cache.set("new", 3)
          assert cache.get("live") == 2
          assert cache.get("new") == 3
          assert cache.get("expired") is None

          # When no expired slot exists, capacity still evicts exactly the live LRU.
          clock = Clock()
          cache = TTLCache(2, 10, clock)
          cache.set("a", 1)
          cache.set("b", 2)
          assert cache.get("a") == 1  # b becomes LRU
          cache.set("c", 3)
          assert cache.get("b") is None
          assert cache.get("a") == 1
          assert cache.get("c") == 3
          print("hidden TTL cache contract passed")
          PY
          python "${RUNNER_TEMP}/hidden_cache.py" > "${RUNNER_TEMP}/hidden-tests.txt" 2>&1
          echo "$?" > "${RUNNER_TEMP}/hidden-tests.exit"
          cat "${RUNNER_TEMP}/hidden-tests.txt"
          exit 0

      - name: Summarize external policy trace
        if: always()
        run: |
          if [ -f "${RUNNER_TEMP}/otel.jsonl" ]; then
            python "$GITHUB_WORKSPACE/scripts/analyze_otel.py" \
              "${RUNNER_TEMP}/otel.jsonl" --events "${RUNNER_TEMP}/output.jsonl" \
              > "${RUNNER_TEMP}/policy-summary.md"
            python "$GITHUB_WORKSPACE/scripts/analyze_tool_ownership.py" \
              "${RUNNER_TEMP}/otel.jsonl" > "${RUNNER_TEMP}/policy-tool-ownership.json"
          fi

      - name: Upload external integrated artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: external-integrated-${{ matrix.repeat }}
          path: |
            ${{ runner.temp }}/output.jsonl
            ${{ runner.temp }}/otel.jsonl
            ${{ runner.temp }}/policy-summary.md
            ${{ runner.temp }}/policy-tool-ownership.json
            ${{ runner.temp }}/candidate.diff
            ${{ runner.temp }}/fixture-status.txt
            ${{ runner.temp }}/visible-tests.txt
            ${{ runner.temp }}/visible-tests.exit
            ${{ runner.temp }}/hidden-tests.txt
            ${{ runner.temp }}/hidden-tests.exit
          if-no-files-found: warn
