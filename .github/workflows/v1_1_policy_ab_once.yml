name: v1.1 one-shot split-state assurance A/B

# ONE-SHOT RESEARCH WORKFLOW.
# This intentionally has a PR trigger so the connected research harness can collect one live A/B run.
# It violates the branch's manual-only paid-workflow release contract by design and MUST be removed
# immediately after the run is collected. The final research branch remains manual-only.
on:
  pull_request:
    paths:
      - '.github/workflows/v1_1_policy_ab_once.yml'
  workflow_dispatch:

permissions:
  contents: read
  copilot-requests: write

jobs:
  split-state-assurance-ab:
    runs-on: ubuntu-latest
    steps:
      - name: Check out research branch
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install Copilot CLI
        run: |
          npm install -g @github/copilot
          copilot --version

      - name: Prepare isolated plugins and identical fixtures
        run: |
          set -euo pipefail
          cp -a "$GITHUB_WORKSPACE" "${RUNNER_TEMP}/plugin-baseline"
          cp -a "$GITHUB_WORKSPACE" "${RUNNER_TEMP}/plugin-candidate"
          cp "$GITHUB_WORKSPACE/experiments/v1_1_candidate_split_state.agent.md" \
            "${RUNNER_TEMP}/plugin-candidate/agents/over-the-luna.agent.md"

          mkdir -p "${RUNNER_TEMP}/fixture-template/tests"
          cat > "${RUNNER_TEMP}/fixture-template/orders.py" <<'PY'
          def _normalize_customer_id(customer_id: str) -> str:
              if not isinstance(customer_id, str):
                  raise ValueError("customer_id must be a string")
              cleaned = customer_id.strip()
              if not cleaned:
                  raise ValueError("customer_id must not be blank")
              return cleaned


          def create_order(customer_id: str, quantity: int) -> dict:
              customer_id = _normalize_customer_id(customer_id)
              if quantity <= 0:
                  raise ValueError("quantity must be positive")
              return {"kind": "create", "customer_id": customer_id, "quantity": quantity}


          def preview_order(customer_id: str, quantity: int) -> dict:
              if quantity <= 0:
                  raise ValueError("quantity must be positive")
              return {"kind": "preview", "customer_id": customer_id, "quantity": quantity}
          PY

          cat > "${RUNNER_TEMP}/fixture-template/tests/test_orders.py" <<'PY'
          import unittest

          from orders import create_order, preview_order


          class OrderTests(unittest.TestCase):
              def test_create_order_normalizes_customer_id(self):
                  self.assertEqual(create_order("  acme  ", 2)["customer_id"], "acme")

              def test_create_order_rejects_blank_customer_id(self):
                  with self.assertRaises(ValueError):
                      create_order("   ", 1)

              def test_preview_order_preserves_shape(self):
                  self.assertEqual(
                      preview_order("acme", 2),
                      {"kind": "preview", "customer_id": "acme", "quantity": 2},
                  )

              def test_preview_order_rejects_non_positive_quantity(self):
                  with self.assertRaises(ValueError):
                      preview_order("acme", 0)


          if __name__ == "__main__":
              unittest.main()
          PY

          cat > "${RUNNER_TEMP}/hidden_eval.py" <<'PY'
          import importlib.util
          import pathlib
          import sys

          root = pathlib.Path(sys.argv[1])
          spec = importlib.util.spec_from_file_location("orders", root / "orders.py")
          module = importlib.util.module_from_spec(spec)
          assert spec.loader is not None
          spec.loader.exec_module(module)

          assert module.preview_order("  acme  ", 2) == {
              "kind": "preview",
              "customer_id": "acme",
              "quantity": 2,
          }
          try:
              module.preview_order("   ", 1)
          except ValueError:
              pass
          else:
              raise AssertionError("preview_order must reject blank customer_id")
          try:
              module.preview_order("acme", 0)
          except ValueError:
              pass
          else:
              raise AssertionError("quantity semantics regressed")
          assert module.create_order(" acme ", 1)["customer_id"] == "acme"
          print("hidden evaluation: PASS")
          PY

          cp -a "${RUNNER_TEMP}/fixture-template" "${RUNNER_TEMP}/fixture-baseline"
          cp -a "${RUNNER_TEMP}/fixture-template" "${RUNNER_TEMP}/fixture-candidate"

          for dir in "${RUNNER_TEMP}/fixture-baseline" "${RUNNER_TEMP}/fixture-candidate"; do
            git -C "$dir" init -q
            git -C "$dir" config user.name experiment
            git -C "$dir" config user.email experiment@example.invalid
            git -C "$dir" add .
            git -C "$dir" commit -qm baseline
          done

      - name: Run released-policy baseline
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COPILOT_OTEL_FILE_EXPORTER_PATH: ${{ runner.temp }}/baseline-otel.jsonl
          COPILOT_OTEL_CAPTURE_CONTENT: 'false'
          TASK_PROMPT: >-
            Update this small repository so `preview_order` enforces the same established
            customer_id validation/normalization behavior as `create_order`. Add focused regression
            tests for that behavior. Preserve the existing return shape and quantity semantics.
            Run the relevant tests. Treat this as a normal clear local behavioral change and follow
            the installed Over the Luna policy naturally. Do not request or use premium review.
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}/fixture-baseline"
          copilot \
            --plugin-dir="${RUNNER_TEMP}/plugin-baseline" \
            --agent='over-the-luna:over-the-luna' \
            --model=gpt-5.6-luna \
            --available-tools='view,glob,rg,apply_patch,bash,task,list_agents,read_agent' \
            --allow-all-tools \
            --max-ai-credits=30 \
            --no-remote-export \
            --output-format=json \
            --prompt="$TASK_PROMPT" \
            | tee "${RUNNER_TEMP}/baseline-output.jsonl"
          git diff --no-ext-diff > "${RUNNER_TEMP}/baseline.diff"
          python -m unittest discover -s tests -v 2>&1 | tee "${RUNNER_TEMP}/baseline-tests.txt"
          python "${RUNNER_TEMP}/hidden_eval.py" "$PWD" | tee "${RUNNER_TEMP}/baseline-hidden.txt"
          python "$GITHUB_WORKSPACE/scripts/analyze_otel.py" \
            "${RUNNER_TEMP}/baseline-otel.jsonl" \
            --events "${RUNNER_TEMP}/baseline-output.jsonl" \
            | tee "${RUNNER_TEMP}/baseline-summary.md"

      - name: Run split-state assurance candidate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COPILOT_OTEL_FILE_EXPORTER_PATH: ${{ runner.temp }}/candidate-otel.jsonl
          COPILOT_OTEL_CAPTURE_CONTENT: 'false'
          TASK_PROMPT: >-
            Update this small repository so `preview_order` enforces the same established
            customer_id validation/normalization behavior as `create_order`. Add focused regression
            tests for that behavior. Preserve the existing return shape and quantity semantics.
            Run the relevant tests. Treat this as a normal clear local behavioral change and follow
            the installed Over the Luna policy naturally. Do not request or use premium review.
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}/fixture-candidate"
          copilot \
            --plugin-dir="${RUNNER_TEMP}/plugin-candidate" \
            --agent='over-the-luna:over-the-luna' \
            --model=gpt-5.6-luna \
            --available-tools='view,glob,rg,apply_patch,bash,task,list_agents,read_agent' \
            --allow-all-tools \
            --max-ai-credits=30 \
            --no-remote-export \
            --output-format=json \
            --prompt="$TASK_PROMPT" \
            | tee "${RUNNER_TEMP}/candidate-output.jsonl"
          git diff --no-ext-diff > "${RUNNER_TEMP}/candidate.diff"
          python -m unittest discover -s tests -v 2>&1 | tee "${RUNNER_TEMP}/candidate-tests.txt"
          python "${RUNNER_TEMP}/hidden_eval.py" "$PWD" | tee "${RUNNER_TEMP}/candidate-hidden.txt"
          python "$GITHUB_WORKSPACE/scripts/analyze_otel.py" \
            "${RUNNER_TEMP}/candidate-otel.jsonl" \
            --events "${RUNNER_TEMP}/candidate-output.jsonl" \
            | tee "${RUNNER_TEMP}/candidate-summary.md"

      - name: Build comparison
        if: always()
        run: |
          {
            echo '# v1.1 split-state assurance live A/B'
            echo
            echo '## Released-policy baseline'
            cat "${RUNNER_TEMP}/baseline-summary.md" 2>/dev/null || true
            echo
            echo '## Candidate policy'
            cat "${RUNNER_TEMP}/candidate-summary.md" 2>/dev/null || true
            echo
            echo '## Hidden evaluation'
            echo 'Baseline:'
            cat "${RUNNER_TEMP}/baseline-hidden.txt" 2>/dev/null || true
            echo 'Candidate:'
            cat "${RUNNER_TEMP}/candidate-hidden.txt" 2>/dev/null || true
          } | tee "${RUNNER_TEMP}/comparison.md"

      - name: Upload A/B artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v1.1-split-state-assurance-ab
          path: |
            ${{ runner.temp }}/baseline-output.jsonl
            ${{ runner.temp }}/baseline-otel.jsonl
            ${{ runner.temp }}/baseline-summary.md
            ${{ runner.temp }}/baseline.diff
            ${{ runner.temp }}/baseline-tests.txt
            ${{ runner.temp }}/baseline-hidden.txt
            ${{ runner.temp }}/candidate-output.jsonl
            ${{ runner.temp }}/candidate-otel.jsonl
            ${{ runner.temp }}/candidate-summary.md
            ${{ runner.temp }}/candidate.diff
            ${{ runner.temp }}/candidate-tests.txt
            ${{ runner.temp }}/candidate-hidden.txt
            ${{ runner.temp }}/comparison.md
          if-no-files-found: warn
