name: v1.1 one-shot assurance adherence replication

# ONE-SHOT RESEARCH WORKFLOW. Delete immediately after collecting this run.
# The PR trigger exists only so the connected research harness can retrieve this one paid experiment.
on:
  pull_request:
    paths:
      - '.github/workflows/v1_1_policy_ab_once.yml'
  workflow_dispatch:

permissions:
  contents: read
  copilot-requests: write

jobs:
  assurance-replication:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        policy: [full, minimal, split]
        repeat: [1, 2]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install Copilot CLI
        run: |
          npm install -g @github/copilot
          copilot --version

      - name: Prepare candidate plugin and fixture
        env:
          POLICY: ${{ matrix.policy }}
        run: |
          set -euo pipefail
          cp -a "$GITHUB_WORKSPACE" "${RUNNER_TEMP}/plugin"
          case "$POLICY" in
            full) candidate='experiments/v1_1_candidate_direct_assurance.agent.md' ;;
            minimal) candidate='experiments/v1_1_candidate_minimal_late_review.agent.md' ;;
            split) candidate='experiments/v1_1_candidate_split_state.agent.md' ;;
            *) exit 2 ;;
          esac
          cp "$GITHUB_WORKSPACE/$candidate" "${RUNNER_TEMP}/plugin/agents/over-the-luna.agent.md"

          mkdir -p "${RUNNER_TEMP}/fixture/tests"
          cat > "${RUNNER_TEMP}/fixture/orders.py" <<'PY'
          def _normalize_customer_id(customer_id: str) -> str:
              if not isinstance(customer_id, str):
                  raise ValueError("customer_id must be a string")
              cleaned = customer_id.strip()
              if not cleaned:
                  raise ValueError("customer_id must not be blank")
              return cleaned


          def create_order(customer_id: str, quantity: int) -> dict:
              customer_id = _normalize_customer_id(customer_id)
              if quantity <= 0:
                  raise ValueError("quantity must be positive")
              return {"kind": "create", "customer_id": customer_id, "quantity": quantity}


          def preview_order(customer_id: str, quantity: int) -> dict:
              if quantity <= 0:
                  raise ValueError("quantity must be positive")
              return {"kind": "preview", "customer_id": customer_id, "quantity": quantity}
          PY

          cat > "${RUNNER_TEMP}/fixture/tests/test_orders.py" <<'PY'
          import unittest
          from orders import create_order, preview_order

          class OrderTests(unittest.TestCase):
              def test_create_order_normalizes_customer_id(self):
                  self.assertEqual(create_order("  acme  ", 2)["customer_id"], "acme")

              def test_create_order_rejects_blank_customer_id(self):
                  with self.assertRaises(ValueError):
                      create_order("   ", 1)

              def test_preview_order_preserves_shape(self):
                  self.assertEqual(
                      preview_order("acme", 2),
                      {"kind": "preview", "customer_id": "acme", "quantity": 2},
                  )

              def test_preview_order_rejects_non_positive_quantity(self):
                  with self.assertRaises(ValueError):
                      preview_order("acme", 0)

          if __name__ == "__main__":
              unittest.main()
          PY

          cat > "${RUNNER_TEMP}/hidden_eval.py" <<'PY'
          import importlib.util, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          spec = importlib.util.spec_from_file_location("orders", root / "orders.py")
          module = importlib.util.module_from_spec(spec)
          assert spec.loader is not None
          spec.loader.exec_module(module)
          assert module.preview_order("  acme  ", 2) == {
              "kind": "preview", "customer_id": "acme", "quantity": 2
          }
          for bad in ("   ", None):
              try:
                  module.preview_order(bad, 1)
              except ValueError:
                  pass
              else:
                  raise AssertionError(f"preview_order must reject {bad!r}")
          try:
              module.preview_order("acme", 0)
          except ValueError:
              pass
          else:
              raise AssertionError("quantity semantics regressed")
          assert module.create_order(" acme ", 1)["customer_id"] == "acme"
          print("hidden evaluation: PASS")
          PY

          git -C "${RUNNER_TEMP}/fixture" init -q
          git -C "${RUNNER_TEMP}/fixture" config user.name experiment
          git -C "${RUNNER_TEMP}/fixture" config user.email experiment@example.invalid
          git -C "${RUNNER_TEMP}/fixture" add .
          git -C "${RUNNER_TEMP}/fixture" commit -qm baseline

      - name: Run candidate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COPILOT_OTEL_FILE_EXPORTER_PATH: ${{ runner.temp }}/otel.jsonl
          COPILOT_OTEL_CAPTURE_CONTENT: 'false'
          TASK_PROMPT: >-
            Update this small repository so `preview_order` enforces the same established
            customer_id validation/normalization behavior as `create_order`. Add focused regression
            tests for that behavior. Preserve the existing return shape and quantity semantics.
            Run the relevant tests. Treat this as a normal clear local behavioral change and follow
            the installed Over the Luna policy naturally. Do not request or use premium review.
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}/fixture"
          copilot \
            --plugin-dir="${RUNNER_TEMP}/plugin" \
            --agent='over-the-luna:over-the-luna' \
            --model=gpt-5.6-luna \
            --available-tools='view,glob,rg,apply_patch,bash,task,list_agents,read_agent' \
            --allow-all-tools \
            --max-ai-credits=30 \
            --no-remote-export \
            --output-format=json \
            --prompt="$TASK_PROMPT" \
            | tee "${RUNNER_TEMP}/output.jsonl"

      - name: Evaluate and summarize
        if: always()
        run: |
          set +e
          cd "${RUNNER_TEMP}/fixture"
          git diff --no-ext-diff > "${RUNNER_TEMP}/patch.diff"
          python -m unittest discover -s tests -v > "${RUNNER_TEMP}/tests.txt" 2>&1
          test_code=$?
          python "${RUNNER_TEMP}/hidden_eval.py" "$PWD" > "${RUNNER_TEMP}/hidden.txt" 2>&1
          hidden_code=$?
          cat "${RUNNER_TEMP}/tests.txt"
          cat "${RUNNER_TEMP}/hidden.txt"
          if [ -f "${RUNNER_TEMP}/otel.jsonl" ]; then
            python "$GITHUB_WORKSPACE/scripts/analyze_otel.py" \
              "${RUNNER_TEMP}/otel.jsonl" \
              --events "${RUNNER_TEMP}/output.jsonl" \
              | tee "${RUNNER_TEMP}/summary.md"
          fi
          printf 'tests_exit=%s\nhidden_exit=%s\n' "$test_code" "$hidden_code" > "${RUNNER_TEMP}/evaluation.txt"
          exit 0

      - name: Upload replication artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: assurance-${{ matrix.policy }}-${{ matrix.repeat }}
          path: |
            ${{ runner.temp }}/output.jsonl
            ${{ runner.temp }}/otel.jsonl
            ${{ runner.temp }}/summary.md
            ${{ runner.temp }}/patch.diff
            ${{ runner.temp }}/tests.txt
            ${{ runner.temp }}/hidden.txt
            ${{ runner.temp }}/evaluation.txt
          if-no-files-found: warn
