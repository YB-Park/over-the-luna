name: Premium harness Phase 0 one-shot

on:
  push:
    branches:
      - experiment/premium-luna-orchestration
    paths:
      - .github/workflows/premium_phase0_once.yml

permissions:
  contents: read
  copilot-requests: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out experiment harness
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          python -m pip install 'PyYAML==6.0.2' 'pytest==8.3.5'
          npm install -g @github/copilot
          copilot --version | tee "${{ runner.temp }}/copilot-version.txt"
          python scripts/validate_plugin.py

      - name: Snapshot plugin and create disposable fixture
        run: |
          mkdir -p "${{ runner.temp }}/otl-plugin"
          cp plugin.json "${{ runner.temp }}/otl-plugin/plugin.json"
          cp -R agents "${{ runner.temp }}/otl-plugin/agents"

          mkdir -p "${{ runner.temp }}/premium-smoke"
          cd "${{ runner.temp }}/premium-smoke"
          git init -q
          git config user.email "smoke@example.invalid"
          git config user.name "Premium Smoke"
          cat > slug.py <<'PY'
          import re

          def canonical_slug(value: str) -> str:
              return value.strip()
          PY
          cat > test_slug.py <<'PY'
          from slug import canonical_slug

          def test_trims_outer_space():
              assert canonical_slug("  hello  ") == "hello"
          PY
          git add slug.py test_slug.py
          git commit -qm "fixture"
          git status --short > "${{ runner.temp }}/pre-status.txt"

      - name: Run Premium Harness structural smoke
        working-directory: ${{ runner.temp }}/premium-smoke
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COPILOT_OTEL_FILE_EXPORTER_PATH: ${{ runner.temp }}/premium-phase0-otel.jsonl
          COPILOT_OTEL_CAPTURE_CONTENT: 'false'
          TASK_PROMPT: >-
            PREMIUM HARNESS PHASE 0 STRUCTURAL SMOKE. Work only in this disposable repository.
            Implement canonical_slug(value) so it trims outer whitespace, lowercases text,
            converts any run of whitespace or underscores to one hyphen, strips leading/trailing
            hyphens after normalization, and raises ValueError when the result is empty.
            Preserve the public function name. Add focused tests and run them. This task has no
            consequential architectural uncertainty, so do not call Architect, Skeptic, or
            Researcher. Use exactly one Luna Builder mutation trajectory, then exactly one Luna
            Auditor independent audit. Do not perform external side effects. Finish only after
            audit. Keep the final response compact.
        run: |
          set -o pipefail
          copilot             --plugin-dir="${{ runner.temp }}/otl-plugin"             --agent='over-the-luna:premium-harness'             --model=gpt-5.6-terra             --available-tools='view,glob,rg,apply_patch,bash,task,list_agents,read_agent'             --allow-all-tools             --max-ai-credits=50             --no-remote-export             --output-format=json             --prompt="$TASK_PROMPT"             | tee "${{ runner.temp }}/premium-phase0-output.jsonl"

          git status --short > "${{ runner.temp }}/post-status.txt"
          git diff --no-ext-diff > "${{ runner.temp }}/premium-phase0.diff"

      - name: Run hidden deterministic oracle
        working-directory: ${{ runner.temp }}/premium-smoke
        run: |
          python - <<'PY' | tee "${{ runner.temp }}/hidden-oracle.txt"
          from slug import canonical_slug

          cases = {
              " Hello__World ": "hello-world",
              "A   B___C": "a-b-c",
              "---Already--Dashed---": "already--dashed",
              "_ Mix_ed Value _": "mix-ed-value",
          }
          for raw, expected in cases.items():
              actual = canonical_slug(raw)
              assert actual == expected, (raw, actual, expected)

          for raw in ("", "   ", "___", " _ _ "):
              try:
                  canonical_slug(raw)
              except ValueError:
                  pass
              else:
                  raise AssertionError(f"expected ValueError for {raw!r}")

          print("HIDDEN_ORACLE_PASS")
          PY

      - name: Upload Phase 0 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: premium-harness-phase0
          path: |
            ${{ runner.temp }}/copilot-version.txt
            ${{ runner.temp }}/premium-phase0-output.jsonl
            ${{ runner.temp }}/premium-phase0-otel.jsonl
            ${{ runner.temp }}/premium-phase0.diff
            ${{ runner.temp }}/pre-status.txt
            ${{ runner.temp }}/post-status.txt
            ${{ runner.temp }}/hidden-oracle.txt
          if-no-files-found: warn
