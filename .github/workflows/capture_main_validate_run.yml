name: Capture main v1.1.1 validation run

on:
  push:
    branches:
      - run/v1.1.1-surface-economy-final
    paths:
      - .github/workflows/capture_main_validate_run.yml

permissions:
  actions: read
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Resolve main validation run
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ba828f6f5370b28ebfc45599f5dcd9fa781b5df2
        run: |
          curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/validate.yml/runs?branch=main&event=push&per_page=10" \
            > "$RUNNER_TEMP/runs.json"
          run_id="$(python - <<'PY'
          import json, os
          from pathlib import Path
          data=json.loads(Path(os.environ['RUNNER_TEMP'],'runs.json').read_text())
          target=os.environ['TARGET_SHA']
          for run in data.get('workflow_runs', []):
              if run.get('head_sha') == target:
                  print(run['id'])
                  break
          PY
          )"
          if [ -z "$run_id" ]; then
            echo "No main validation run found for $TARGET_SHA" >&2
            exit 1
          fi
          printf '%s\n' "$run_id" > main_v1_1_1_validate_run_id.txt
          printf 'https://github.com/${{ github.repository }}/actions/runs/%s\n' "$run_id" > main_v1_1_1_validate_run_url.txt
          echo "Main validation run: $run_id"
      - name: Publish marker
        run: |
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git config user.name 'github-actions[bot]'
          git add -- main_v1_1_1_validate_run_id.txt main_v1_1_1_validate_run_url.txt
          git commit -m 'Record main v1.1.1 validation run' || exit 0
          git push
